<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>The Game — Prototype 1.3 (weapons)</title>
<style>
  html, body { margin: 0; height: 100%; background: #14161c; color: #cfd4dc; font-family: -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
  #wrap { display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: center; gap: 10px; }
  canvas { background: #1c2029; border: 1px solid #2c313c; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.4); cursor: crosshair; touch-action: none; }
  #hud { font-size: 13px; color: #7f8794; letter-spacing: .3px; }
  #hud b { color: #cfd4dc; }
  /* On touch devices: fill the screen and hide the desktop controls hint */
  @media (pointer: coarse) {
    #wrap { gap: 0; }
    #hud { display: none; }
    canvas { border: none; border-radius: 0; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="900" height="560"></canvas>
  <div id="hud">
    <b>Move:</b> right-click / hold, or Arrow keys &nbsp;·&nbsp;
    <b>Attack:</b> left-click / hold (swing or shoot) &nbsp;·&nbsp;
    <b>Spells:</b> Q W E R &nbsp;·&nbsp;
    <b>Potions:</b> 1 / 2 &nbsp;·&nbsp;
    <b>Inventory:</b> I &nbsp;·&nbsp;
    <b>Settings:</b> Esc &nbsp;·&nbsp;
    <b>Restart:</b> R (dead)
  </div>
</div>

<script>
// =====================================================================
//  THE GAME — Prototype 0.8
//  Adds: 2nd ring slot · STR/AGI/INT attributes with derived stats
//  (Health/Mana/AtkSpeed) · weapon TYPES (melee swings + bow shots) with
//  attack animations · left-click attack / right-click move.
//  FUTURE hooks: class primary-stat damage bonus; spell levels; keybinds.
// =====================================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = canvas.width, H = canvas.height;

const WALL = 24;
const ROOM = { left: WALL, top: WALL, right: W - WALL, bottom: H - WALL };
const BOSS_EVERY = 5;
const DOOR = { h: 104, cx: W - WALL / 2, cy: H / 2 };

// --------------------------------------------------------------------
//  REGIONS — each is a run of levels ending in a boss, with its own look,
//  enemies and feel. After the last region the cycle repeats, harder.
// --------------------------------------------------------------------
const REGION_LEVELS = 5;   // levels per region (last one is the boss)
const REGIONS = [
  { name: 'Frostvale', tag: 'Frozen caverns', prop: 'ice',
    floor: '#1b2430', grid: '#243243', wall: '#33465e', wallEdge: '#5b7 da', accent: '#9fd8ff',
    enemy: '#5f8fb5', enemyHit: '#bfe4ff', boss: '#3f6fa5',
    hp: 1.15, dmg: 0.95, spd: 0.85, count: 1.0, blurb: 'Thick-hided beasts. Slow, but they soak damage.' },
  { name: 'Verdant Hollow', tag: 'Overgrown forest', prop: 'tree',
    floor: '#18251c', grid: '#20301f', wall: '#2f4a33', wallEdge: '#4d7a52', accent: '#8fe0a0',
    enemy: '#6f9f4f', enemyHit: '#d4f5a0', boss: '#3f7a3f',
    hp: 0.85, dmg: 1.0, spd: 1.2, count: 1.35, blurb: 'Swarms of fast, fragile creatures.' },
  { name: 'Emberwaste', tag: 'Scorched wastes', prop: 'rock',
    floor: '#2a1a18', grid: '#3a2320', wall: '#5e3630', wallEdge: '#8a4f42', accent: '#ff9a5c',
    enemy: '#c25f3f', enemyHit: '#ffb37a', boss: '#a8323f',
    hp: 1.0, dmg: 1.35, spd: 1.0, count: 1.0, blurb: 'They hit hard. Do not get surrounded.' },
  { name: 'Shadowmire', tag: 'Haunted swamp', prop: 'mush',
    floor: '#1d1a2a', grid: '#272238', wall: '#3f3560', wallEdge: '#645488', accent: '#c9a0ff',
    enemy: '#7a5fb0', enemyHit: '#dcc0ff', boss: '#5f3f9a',
    hp: 1.1, dmg: 1.15, spd: 1.1, count: 1.15, blurb: 'Everything here is faster and meaner.' },
];
function regionIndexFor(level) { return Math.floor((level - 1) / REGION_LEVELS); }
function currentRegion() { return REGIONS[regionIndexFor(game.level) % REGIONS.length]; }
function regionLoop() { return Math.floor(regionIndexFor(game.level) / REGIONS.length); } // 0 on first pass
function levelInRegion() { return ((game.level - 1) % REGION_LEVELS) + 1; }
// Each completed cycle through all regions ramps everything up hard.
function loopMult() { return 1 + regionLoop() * 0.85; }
let props = [];

// The playfield switches between landscape and portrait to match the device.
function setResolution(w, h) {
  if (W === w && H === h) return;
  canvas.width = w; canvas.height = h; W = w; H = h;
  ROOM.left = WALL; ROOM.top = WALL; ROOM.right = W - WALL; ROOM.bottom = H - WALL;
  DOOR.cx = W - WALL / 2; DOOR.cy = H / 2;
}

// --------------------------------------------------------------------
//  RARITY + ITEMS
// --------------------------------------------------------------------
const RARITIES = [
  { name: 'Normal',    color: '#c6ccd4', weight: 46, mult: 1.0 },
  { name: 'Uncommon',  color: '#5fcf6f', weight: 27, mult: 1.5 },
  { name: 'Rare',      color: '#4a90d9', weight: 16, mult: 2.2 },
  { name: 'Epic',      color: '#b96fe0', weight: 8,  mult: 3.2 },
  { name: 'Legendary', color: '#ff8a3c', weight: 3,  mult: 4.6 },
];
const RARITY_TOTAL = RARITIES.reduce((s, r) => s + r.weight, 0);

// Weapon definitions: melee variants swing arcs; bow shoots arrows.
// PRIMARY stats scale your class. Everything else is a SECONDARY stat.
const PRIMARY_STATS = ['STR', 'AGI', 'INT'];
const SECONDARY_STATS = ['Armor', 'Speed', 'Crit', 'CritDmg', 'SpellPower', 'SpellHaste', 'AtkSpeed'];
function isPrimaryStat(s) { return PRIMARY_STATS.indexOf(s) >= 0; }

// twoHanded weapons cannot be used together with an Off-hand.
// caster:true weapons grant Spell Power instead of Attack Damage.
const WEAPONS = {
// attrs = which PRIMARY stats this weapon can roll, so one weapon type can suit
// several classes (e.g. an AGI dagger for a rogue or an INT dagger for a mage).
  fist:      { ranged: false, arc: 0.60, reach: 46, spd: 1.15, base: 0,  color: '#dbe7f5', attrs: []  },
  dagger:    { ranged: false, arc: 0.55, reach: 44, spd: 1.55, base: 7,  color: '#d7f0ff', attrs: ['AGI', 'INT'] },
  sword:     { ranged: false, arc: 0.75, reach: 66, spd: 1.05, base: 10, color: '#cfe6ff', attrs: ['STR', 'AGI'] },
  axe:       { ranged: false, arc: 1.15, reach: 72, spd: 0.75, base: 15, color: '#ffcaa0', attrs: ['STR'] },
  mace:      { ranged: false, arc: 0.95, reach: 58, spd: 0.85, base: 12, color: '#e6d7a3', attrs: ['STR', 'INT'] },
  wand:      { ranged: false, arc: 0.50, reach: 42, spd: 1.10, base: 2,  color: '#e0b0ff', attrs: ['INT'], caster: true, power: 9 },
  greatsword:{ ranged: false, arc: 1.05, reach: 84, spd: 0.80, base: 20, color: '#9fd0ff', attrs: ['STR'], twoHanded: true },
  battleaxe: { ranged: false, arc: 1.45, reach: 90, spd: 0.58, base: 28, color: '#ffb37a', attrs: ['STR'], twoHanded: true },
  warhammer: { ranged: false, arc: 1.20, reach: 74, spd: 0.66, base: 24, color: '#e8c97a', attrs: ['STR', 'INT'], twoHanded: true },
  bow:       { ranged: true,  arc: 0,    reach: 0,  spd: 1.05, base: 9,  color: '#bfe6a0', attrs: ['AGI'], twoHanded: true },
  staff:     { ranged: false, arc: 0.70, reach: 60, spd: 0.95, base: 3,  color: '#c9a0ff', attrs: ['INT'], twoHanded: true, caster: true, power: 20 },
};
// Which secondary stats suit each primary — an INT weapon rolls caster stats, etc.
const ROLLS_FOR = {
  STR: ['Crit', 'CritDmg', 'AtkSpeed'],
  AGI: ['Crit', 'CritDmg', 'AtkSpeed', 'AtkSpeed'],
  INT: ['Crit', 'CritDmg', 'SpellHaste', 'SpellPower'],
};
function isCasterWeapon(item) { return !!(item && item.weapon && WEAPONS[item.weapon] && WEAPONS[item.weapon].caster); }

// slot + how the item's value is applied. 'ATTR' rolls a random attribute.
const ITEM_TYPES = [
  { type: 'Dagger',    slot: 'Weapon', weapon: 'dagger' },
  { type: 'Sword',     slot: 'Weapon', weapon: 'sword' },
  { type: 'Axe',       slot: 'Weapon', weapon: 'axe'   },
  { type: 'Mace',      slot: 'Weapon', weapon: 'mace'  },
  { type: 'Wand',      slot: 'Weapon', weapon: 'wand'  },
  { type: 'Greatsword',slot: 'Weapon', weapon: 'greatsword' },
  { type: 'Battle Axe',slot: 'Weapon', weapon: 'battleaxe'  },
  { type: 'Warhammer', slot: 'Weapon', weapon: 'warhammer'  },
  { type: 'Bow',       slot: 'Weapon', weapon: 'bow'   },
  { type: 'Staff',     slot: 'Weapon', weapon: 'staff' },
  // Off-hands: Shield for fighters, Tome/Orb for casters (WoW-style)
  { type: 'Shield', slot: 'Off-hand', stat: 'Armor'      },
  { type: 'Tome',   slot: 'Off-hand', stat: 'ATTR_INT'   },
  { type: 'Orb',    slot: 'Off-hand', stat: 'SpellPower' },
  { type: 'Helm',   slot: 'Helm',     stat: 'Armor'   },
  { type: 'Boots',  slot: 'Boots',    stat: 'Speed'   },
  { type: 'Amulet', slot: 'Amulet',   stat: 'ATTR'    },
  { type: 'Ring',   slot: 'Ring',     stat: 'ATTR'    },
];
const SLOTS = ['Weapon', 'Off-hand', 'Helm', 'Amulet', 'Ring1', 'Ring2', 'Boots'];
const ATTRS = ['STR', 'AGI', 'INT'];

// Classes: each has a PRIMARY attribute that boosts its main damage type.
//  Warrior STR -> melee attack damage · Rogue AGI -> attack damage (+ speed)
//  Mage INT -> spell power (INT counts double for spells).
const CLASSES = [
  { name: 'Warrior', primary: 'STR', color: '#e08a4a', startWeapon: 'sword',
    base: { STR: 6, AGI: 1, INT: 0 }, desc: 'Tanky melee bruiser. STR raises Health and attack damage.' },
  { name: 'Hunter',  primary: 'AGI', color: '#5fcf8f', startWeapon: 'bow',
    base: { STR: 1, AGI: 6, INT: 0 }, desc: 'Fast ranged skirmisher. AGI raises attack speed and damage.' },
  { name: 'Mage',    primary: 'INT', color: '#7fb8ff', startWeapon: 'staff',
    base: { STR: 0, AGI: 1, INT: 6 }, desc: 'Fragile spellcaster. INT raises Mana and spell power.' },
];

function rollRarity(minIdx = 0) {
  let r = Math.random() * RARITY_TOTAL, idx = 0;
  for (let i = 0; i < RARITIES.length; i++) { if ((r -= RARITIES[i].weight) <= 0) { idx = i; break; } }
  if (idx < minIdx) idx = minIdx;
  return RARITIES[idx];
}
// Rolls a SECONDARY stat affix (crit chance, crit damage, spell haste, spell power).
const SECONDARY_ROLLS = ['Crit', 'CritDmg', 'SpellHaste'];
const CASTER_ROLLS = ['Crit', 'CritDmg', 'SpellHaste', 'SpellPower'];
function secondaryAffix(rarIdx, pool) {
  const list = pool || SECONDARY_ROLLS;
  const s = list[Math.floor(Math.random() * list.length)];
  const m = 0.8 + 0.12 * rarIdx;
  if (s === 'Crit')       return { stat: 'Crit',       value: Math.max(1, Math.round((2 + Math.random() * 4) * m)) };
  if (s === 'CritDmg')    return { stat: 'CritDmg',    value: Math.round((10 + Math.random() * 18) * m) };
  if (s === 'SpellHaste') return { stat: 'SpellHaste', value: Math.max(1, Math.round((3 + Math.random() * 6) * m)) };
  if (s === 'AtkSpeed')   return { stat: 'AtkSpeed',   value: Math.max(1, Math.round((3 + Math.random() * 7) * m)) };
  return                         { stat: 'SpellPower', value: Math.max(1, Math.round((4 + Math.random() * 8) * m)) };
}
function makeItem(minIdx = 0) {
  const rar = rollRarity(minIdx);
  return buildItem(rar, ITEM_TYPES[Math.floor(Math.random() * ITEM_TYPES.length)]);
}
// Builds an item of an EXACT rarity and type (used by loot rolls and the Forge).
function buildItem(rar, t) {
  const rarIdx = RARITIES.indexOf(rar);
  const scale = 3 + Math.floor(Math.random() * 6) + Math.floor(game.level * 0.8);
  const item = { name: `${rar.name} ${t.type}`, rarity: rar, slot: t.slot, type: t.type };
  if (t.weapon) {
    const wd = WEAPONS[t.weapon];
    item.weapon = t.weapon; item.ranged = wd.ranged;
    if (wd.caster) {
      // Caster weapons (Staff/Wand) give SPELL POWER, not attack damage.
      item.stat = 'SpellPower';
      item.value = Math.round((wd.power + scale) * rar.mult);
    } else {
      item.stat = 'AtkDmg';
      item.value = Math.round((wd.base + scale) * rar.mult);
    }
    // Pick which PRIMARY this weapon rolled — that decides who it suits and
    // which secondary stats it can get (AGI dagger vs INT dagger, etc).
    const attrs = wd.attrs || [];
    if (attrs.length) {
      const a = attrs[Math.floor(Math.random() * attrs.length)];
      item.bonusStat = a; item.bonusValue = Math.max(1, Math.round(scale * 0.5 * rar.mult));
      const pool = ROLLS_FOR[a] || SECONDARY_ROLLS;
      const c1 = secondaryAffix(rarIdx, pool);
      item.bonusStat2 = c1.stat; item.bonusValue2 = c1.value;
      // higher rarities often roll a third line
      if (Math.random() < 0.18 + 0.14 * rarIdx) {
        const c2 = secondaryAffix(rarIdx, pool.filter(s => s !== c1.stat));
        if (c2) { item.bonusStat3 = c2.stat; item.bonusValue3 = c2.value; }
      }
    }
  } else if (t.stat === 'ATTR_INT') {
    // Caster off-hand (Tome): Intellect + a caster secondary
    item.stat = 'INT'; item.value = Math.round(scale * rar.mult);
    const c = secondaryAffix(rarIdx, CASTER_ROLLS); item.bonusStat2 = c.stat; item.bonusValue2 = c.value;
  } else if (t.stat === 'SpellPower') {
    // Caster off-hand (Orb): Spell Power + often Intellect
    item.stat = 'SpellPower'; item.value = Math.max(1, Math.round(scale * 0.9 * rar.mult));
    if (Math.random() < 0.7) { item.bonusStat = 'INT'; item.bonusValue = Math.max(1, Math.round(scale * 0.5 * rar.mult)); }
    else { const c = secondaryAffix(rarIdx, CASTER_ROLLS); item.bonusStat2 = c.stat; item.bonusValue2 = c.value; }
  } else if (t.stat === 'Armor') {
    item.stat = 'Armor'; item.value = Math.round(scale * rar.mult);
    if (Math.random() < 0.25 + 0.08 * rarIdx) { const c = secondaryAffix(rarIdx); item.bonusStat2 = c.stat; item.bonusValue2 = c.value; }
  } else if (t.stat === 'ATTR') {
    // Jewelry: a PRIMARY attribute, or sometimes a SECONDARY stat instead
    if (Math.random() < 0.45) { const c = secondaryAffix(rarIdx, CASTER_ROLLS); item.stat = c.stat; item.value = c.value; }
    else { item.stat = ATTRS[Math.floor(Math.random() * ATTRS.length)]; item.value = Math.round(scale * rar.mult); }
  } else {
    item.stat = t.stat;
    item.value = Math.round(scale * rar.mult);
  }
  return item;
}

// --------------------------------------------------------------------
//  INPUT
// --------------------------------------------------------------------
const keys = {};
const mouse = { x: W / 2, y: H / 2, leftDown: false, rightDown: false };
let showInv = false;
let invRects = [];
let moveTarget = null;

// ---- Keybinds (rebindable in the Settings screen, Esc) ----
function defaultBinds() { return { spell0: 'q', spell1: 'w', spell2: 'e', spell3: 'r', health: '1', mana: '2', inventory: 'i' }; }
let binds = defaultBinds();
let settingsOpen = false, awaitingBind = null, settingsRects = [];
const BIND_ROWS = [
  { id: 'spell0', label: 'Spell 1' }, { id: 'spell1', label: 'Spell 2' },
  { id: 'spell2', label: 'Spell 3' }, { id: 'spell3', label: 'Spell 4' },
  { id: 'health', label: 'Health potion' }, { id: 'mana', label: 'Mana potion' },
  { id: 'inventory', label: 'Inventory' },
];
function saveBinds() { try { localStorage.setItem('thegame_binds', JSON.stringify(binds)); } catch (e) {} }
function loadBinds() { try { const s = localStorage.getItem('thegame_binds'); if (s) Object.assign(binds, JSON.parse(s)); } catch (e) {} }
loadBinds();
// Touch movement mode: 'joystick' (floating, spawns wherever you touch) or 'tap' (tap-to-move).
let touchMoveMode = 'joystick';
function saveTouchMode() { try { localStorage.setItem('thegame_touchmode', touchMoveMode); } catch (e) {} }
(function () { try { const s = localStorage.getItem('thegame_touchmode'); if (s === 'joystick' || s === 'tap') touchMoveMode = s; } catch (e) {} })();
function spellKey(i) { return binds['spell' + i]; }
function spellIndexForKey(k) { for (let i = 0; i < 4; i++) if (binds['spell' + i] === k) return i; return -1; }
function keyDisplay(k) {
  const map = { arrowup: '↑', arrowdown: '↓', arrowleft: '←', arrowright: '→', ' ': 'Space', escape: 'Esc' };
  return map[k] || (k ? k.toUpperCase() : '—');
}
function assignBind(k) {
  if (k === 'escape') { awaitingBind = null; return; }      // cancel rebind
  for (const a in binds) { if (a !== awaitingBind && binds[a] === k) binds[a] = binds[awaitingBind]; } // swap to avoid dupes
  binds[awaitingBind] = k; awaitingBind = null; saveBinds();
}
function handleSettingsClick() {
  for (const r of settingsRects) {
    if (mouse.x >= r.x && mouse.x <= r.x + r.w && mouse.y >= r.y && mouse.y <= r.y + r.h) {
      if (r.id === '__reset') { binds = defaultBinds(); awaitingBind = null; saveBinds(); }
      else if (r.id === '__touchmode') { touchMoveMode = (touchMoveMode === 'joystick' ? 'tap' : 'joystick'); saveTouchMode(); joyId = null; touchMove.active = false; touchMove.x = 0; touchMove.y = 0; }
      else awaitingBind = (awaitingBind === r.id ? null : r.id);
      return;
    }
  }
}

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k.startsWith('arrow')) e.preventDefault();

  // Settings screen captures input (and rebinding grabs the next key)
  if (settingsOpen) {
    if (awaitingBind) { assignBind(k); e.preventDefault(); return; }
    if (k === 'escape') settingsOpen = false;
    return;
  }
  if (mergeOpen) { if (k === 'escape' || k === binds.inventory) closeMerge(); return; }
  if (k === 'escape' && !game.menu) { settingsOpen = true; awaitingBind = null; return; }

  if (e.key === ' ') { e.preventDefault(); tryAttack(); }
  if (game.over && k === 'r') { fullReset(); return; }        // restart on death
  if (k === 'c' && game.over) { game.menu = true; return; }   // back to class select
  if (k === binds.inventory) { showInv = !showInv; if (showInv) invScroll = 0; }
  if (k === binds.health) drinkHealth();
  if (k === binds.mana) drinkMana();
  const si = spellIndexForKey(k);
  if (si >= 0) castSpell(si);
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
// Map a screen (client) point to internal canvas coordinates, accounting for CSS scaling.
function canvasPos(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return { x: (clientX - r.left) * (W / r.width), y: (clientY - r.top) * (H / r.height) };
}
canvas.addEventListener('mousemove', e => { const p = canvasPos(e.clientX, e.clientY); mouse.x = p.x; mouse.y = p.y; });
canvas.addEventListener('mousedown', e => {
  if (game.menu) { if (e.button === 0) handleMenuClick(); return; }
  if (settingsOpen) { if (e.button === 0) handleSettingsClick(); return; }
  if (mergeOpen) { if (e.button === 0 && !handleMergeClick()) closeMerge(); return; }
  if (e.button === 2) { // right = move
    mouse.rightDown = true;
    if (!game.over && !showInv) moveTarget = { x: mouse.x, y: mouse.y };
    return;
  }
  // left button
  mouse.leftDown = true;
  if (game.over) { fullReset(); return; }
  if (showInv && handleInventoryClick()) return;
  tryAttack();
});
canvas.addEventListener('mouseup', e => { if (e.button === 2) mouse.rightDown = false; else mouse.leftDown = false; });
// Mouse wheel scrolls the backpack when the inventory is open
canvas.addEventListener('wheel', e => {
  if (mergeOpen) { e.preventDefault(); mergeScroll += (e.deltaY > 0 ? 2 : -2); return; }
  if (!showInv) return; e.preventDefault(); invScroll += (e.deltaY > 0 ? 2 : -2);
}, { passive: false });

// --------------------------------------------------------------------
//  TOUCH CONTROLS (phones/tablets) — virtual joystick + on-screen buttons
// --------------------------------------------------------------------
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
let touchMove = { x: 0, y: 0, active: false };
let joyId = null, joyOrigin = { x: 0, y: 0 }, joyKnob = { x: 0, y: 0 };
let touchAttack = false;
const touchRoles = {}; // touch identifier -> role string

// Round action buttons on the right; positions in internal canvas coords.
// Buttons are anchored to the screen edges so they land correctly in both orientations.
function touchButtons() {
  return [
    { id: 'attack',   x: W - 64,  y: H - 94,  r: 46 },
    { id: 'potionH',  x: W - 210, y: H - 188, r: 22 },
    { id: 'potionM',  x: W - 148, y: H - 188, r: 22 },
    { id: 'inv',      x: W - 34,  y: 150,     r: 22 },
    { id: 'settings', x: W - 34,  y: 100,     r: 22 },
  ];
}
function spellBtn(i) {
  const gx = [W - 210, W - 148, W - 210, W - 148][i], gy = [H - 130, H - 130, H - 68, H - 68][i];
  return { x: gx, y: gy, r: 28 };
}
// Pick portrait or landscape playfield, then scale it to fill the screen.
function resizeCanvas() {
  if (isTouch) setResolution(...(window.innerHeight > window.innerWidth ? [560, 900] : [900, 560]));
  const padW = isTouch ? 0 : 24, padH = isTouch ? 0 : 64;
  const scale = Math.min((window.innerWidth - padW) / W, (window.innerHeight - padH) / H);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 60));

if (isTouch) {
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const p = canvasPos(t.clientX, t.clientY);
      if (game.menu) { mouse.x = p.x; mouse.y = p.y; handleMenuClick(); continue; }
      if (game.over) { fullReset(); continue; }
      if (settingsOpen) {
        const pw = 380, ph = 424, px = (W - pw) / 2, py = (H - ph) / 2;
        mouse.x = p.x; mouse.y = p.y;
        if (p.x >= px && p.x <= px + pw && p.y >= py && p.y <= py + ph) handleSettingsClick();
        else settingsOpen = false;
        continue;
      }
      if (mergeOpen) { mouse.x = p.x; mouse.y = p.y; if (!handleMergeClick()) closeMerge(); continue; }
      if (showInv) { mouse.x = p.x; mouse.y = p.y; if (!handleInventoryClick()) showInv = false; continue; }
      // Gameplay: buttons first, then joystick on the left half.
      let hit = null;
      for (const b of touchButtons()) { if (Math.hypot(p.x - b.x, p.y - b.y) <= b.r) { hit = b.id; break; } }
      if (!hit) for (let i = 0; i < 4; i++) { const b = spellBtn(i); if (player.spells[i] && Math.hypot(p.x - b.x, p.y - b.y) <= b.r) { hit = 'spell' + i; break; } }
      if (hit) {
        touchRoles[t.identifier] = hit;
        if (hit === 'attack') touchAttack = true;
        else if (hit === 'potionH') drinkHealth();
        else if (hit === 'potionM') drinkMana();
        else if (hit === 'inv') { showInv = !showInv; if (showInv) invScroll = 0; }
        else if (hit === 'settings') { settingsOpen = true; awaitingBind = null; }
        else if (hit.startsWith('spell')) castSpell(+hit.slice(5));
        continue;
      }
      // Not on a button: either spawn a floating joystick here, or tap-to-move.
      if (touchMoveMode === 'tap') {
        moveTarget = { x: p.x, y: p.y }; touchRoles[t.identifier] = 'tap';
      } else if (joyId === null) {
        joyId = t.identifier; joyOrigin = { x: p.x, y: p.y }; joyKnob = { x: p.x, y: p.y };
        touchMove.active = true; touchMove.x = 0; touchMove.y = 0; touchRoles[t.identifier] = 'joy';
      }
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === joyId) {
        const p = canvasPos(t.clientX, t.clientY);
        let dx = p.x - joyOrigin.x, dy = p.y - joyOrigin.y; const d = Math.hypot(dx, dy), R = 60;
        if (d > R) { dx = dx / d * R; dy = dy / d * R; }
        joyKnob = { x: joyOrigin.x + dx, y: joyOrigin.y + dy };
        touchMove.x = dx / R; touchMove.y = dy / R;
      } else if (touchRoles[t.identifier] === 'tap') {
        const p = canvasPos(t.clientX, t.clientY); moveTarget = { x: p.x, y: p.y }; // drag to keep steering
      }
    }
  }, { passive: false });

  const endTouch = e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (t.identifier === joyId) { joyId = null; touchMove.active = false; touchMove.x = 0; touchMove.y = 0; }
      if (touchRoles[t.identifier] === 'attack') touchAttack = false;
      delete touchRoles[t.identifier];
    }
  };
  canvas.addEventListener('touchend', endTouch, { passive: false });
  canvas.addEventListener('touchcancel', endTouch, { passive: false });
}

// --------------------------------------------------------------------
//  GAME STATE
// --------------------------------------------------------------------
const game = { menu: true, over: false, cleared: false, time: 0, kills: 0, level: 1, isBoss: false, banner: null };

// --------------------------------------------------------------------
//  PLAYER + STATS
// --------------------------------------------------------------------
const BASE = { hp: 100, mana: 100, speed: 3.2, punch: 16 };
const player = {
  x: W / 2, y: H / 2, radius: 16, facing: 0,
  hp: 100, maxHp: 100, hpRegen: 0, hitFlash: 0, healFlash: 0, manaFlash: 0, combatT: 0,
  mana: 100, maxMana: 100, manaRegen: 0.12,
  speed: BASE.speed, potions: 1, manaPotions: 1,
  class: null, spellPower: 0, spells: [], shards: [0, 0, 0, 0, 0],
  attrs: { STR: 0, AGI: 0, INT: 0 },
  weapon: { key: 'fist', ranged: false, arc: WEAPONS.fist.arc, reach: WEAPONS.fist.reach, color: WEAPONS.fist.color },
  inventory: [],
  equipped: { Weapon: null, 'Off-hand': null, Helm: null, Amulet: null, Ring1: null, Ring2: null, Boots: null },
  stats: { attackDamage: BASE.punch, armor: 0, attacksPerSec: 2.7, critChance: 0.05, critDamage: 1.5 },
};
const POTION_HEAL = 45, POTION_MANA = 55;
const POTION_CAP = 5, MANA_POTION_CAP = 5; // max you can carry — extras stay on the ground

function recomputeStats() {
  // gather attributes + flat bonuses from gear
  let STR = 0, AGI = 0, INT = 0, armor = 0, speedBonus = 0, weaponDamage = 0, critChance = 0, critDmg = 0, spellPowerGear = 0, spellHaste = 0, atkSpeed = 0;
  // Every gear line is one of: PRIMARY (STR/AGI/INT) or SECONDARY (everything else).
  const addStat = (s, v) => {
    if (!s || !v) return;
    if (s === 'STR') STR += v;
    else if (s === 'AGI') AGI += v;
    else if (s === 'INT') INT += v;
    else if (s === 'Armor') armor += v;
    else if (s === 'Speed') speedBonus += v;
    else if (s === 'AtkDmg') weaponDamage += v;
    else if (s === 'Crit') critChance += v;
    else if (s === 'CritDmg') critDmg += v;
    else if (s === 'SpellPower') spellPowerGear += v;
    else if (s === 'SpellHaste') spellHaste += v;
    else if (s === 'AtkSpeed') atkSpeed += v;
  };
  for (const slot of SLOTS) {
    const it = player.equipped[slot]; if (!it) continue;
    addStat(it.stat, it.value);
    addStat(it.bonusStat, it.bonusValue);
    addStat(it.bonusStat2, it.bonusValue2);
    addStat(it.bonusStat3, it.bonusValue3);
  }
  if (player.class) { STR += player.class.base.STR; AGI += player.class.base.AGI; INT += player.class.base.INT; }
  player.attrs = { STR, AGI, INT };
  const prim = player.class ? player.class.primary : null;

  // Weapon
  const wq = player.equipped.Weapon;
  const wkey = wq ? wq.weapon : 'fist';
  const wdef = WEAPONS[wkey];
  player.weapon = { key: wkey, ranged: wdef.ranged, arc: wdef.arc, reach: wdef.reach, color: wdef.color };

  // Derived: Attack damage + class primary bonus (STR or AGI classes).
  let atk = BASE.punch + weaponDamage;
  if (prim === 'STR') atk += Math.round(STR * 1.2);
  else if (prim === 'AGI') atk += Math.round(AGI * 1.2);
  player.stats.attackDamage = atk;
  player.stats.armor = armor;
  // Spell power = gear Spell Power + INT (doubled when INT is your primary).
  player.spellPower = Math.round(spellPowerGear + INT * (prim === 'INT' ? 2 : 1));
  // Spell haste shortens spell cooldowns (capped at 60% reduction).
  player.stats.spellHaste = spellHaste;
  player.stats.hasteMult = 1 / (1 + Math.min(150, spellHaste) / 100);

  // Attack speed from AGI + weapon speed
  const atkSpeedMult = (1 + AGI * 0.04) * wdef.spd * (1 + atkSpeed / 100);
  player.stats.atkSpeedBonus = atkSpeed;
  attack.cooldownMax = Math.max(5, Math.round(22 / atkSpeedMult));
  attack.arc = wdef.arc; attack.reach = wdef.reach; attack.color = wdef.color; attack.ranged = wdef.ranged;
  player.stats.attacksPerSec = 60 / attack.cooldownMax;

  // Health from STR
  const oldMaxHp = player.maxHp;
  player.maxHp = BASE.hp + STR * 8;
  player.hpRegen = STR * 0.02;
  if (player.maxHp > oldMaxHp) player.hp += (player.maxHp - oldMaxHp);
  player.hp = Math.min(player.hp, player.maxHp);

  // Mana from INT
  const oldMaxMana = player.maxMana;
  player.maxMana = BASE.mana + INT * 6;
  player.manaRegen = 0.12 + INT * 0.03;
  if (player.maxMana > oldMaxMana) player.mana += (player.maxMana - oldMaxMana);
  player.mana = Math.min(player.mana, player.maxMana);

  // Move speed
  player.speed = BASE.speed + speedBonus * 0.06;

  // Critical strike: base 5% chance, 150% damage; gear adds to both (chance capped at 75%).
  player.stats.critChance = clamp(0.05 + critChance / 100, 0, 0.75);
  player.stats.critDamage = 1.5 + critDmg / 100;
}

function isTwoHanded(item) { return !!(item && item.weapon && WEAPONS[item.weapon] && WEAPONS[item.weapon].twoHanded); }
function equipItem(item) {
  const idx = player.inventory.indexOf(item); if (idx === -1) return;
  player.inventory.splice(idx, 1);
  let target = item.slot;
  if (item.slot === 'Ring') {
    if (!player.equipped.Ring1) target = 'Ring1';
    else if (!player.equipped.Ring2) target = 'Ring2';
    else target = 'Ring1';
  }
  const prev = player.equipped[target]; player.equipped[target] = item;
  if (prev) player.inventory.push(prev);
  // Two-handed weapons and off-hands are mutually exclusive.
  if (target === 'Weapon' && isTwoHanded(item) && player.equipped['Off-hand']) {
    player.inventory.push(player.equipped['Off-hand']); player.equipped['Off-hand'] = null;
    fx.push({ kind: 'toast', text: 'Two-handed weapon — shield unequipped', life: 130, maxLife: 130 });
  } else if (target === 'Off-hand' && isTwoHanded(player.equipped.Weapon)) {
    player.inventory.push(player.equipped.Weapon); player.equipped.Weapon = null;
    fx.push({ kind: 'toast', text: 'Shield equipped — two-handed weapon unequipped', life: 130, maxLife: 130 });
  }
  recomputeStats();
}
function unequipSlot(slot) {
  const it = player.equipped[slot]; if (!it) return;
  player.equipped[slot] = null; player.inventory.push(it); recomputeStats();
}
function drinkHealth() {
  if (game.menu || game.over || player.potions <= 0 || player.hp >= player.maxHp) return;
  player.hp = Math.min(player.maxHp, player.hp + POTION_HEAL); player.potions--; player.healFlash = 12;
}
function drinkMana() {
  if (game.menu || game.over || player.manaPotions <= 0 || player.mana >= player.maxMana) return;
  player.mana = Math.min(player.maxMana, player.mana + POTION_MANA); player.manaPotions--; player.manaFlash = 12;
}

// --------------------------------------------------------------------
//  SPELLS  (per-class spellbooks · damage scales with class primary stat
//           · cooldown scales with damage · spells LEVEL up)
// --------------------------------------------------------------------
// kind = how the effect behaves. cost = mana. cd = base cooldown (frames).
// dmg = base damage before stat scaling + level scaling.
const SPELL_LIB = {
  // WARRIOR — melee, hard-hitting, longer cooldowns, cheap mana
  cleave: { name: 'Cleave',      cls: 'Warrior', color: '#ff9a4a', cost: 6,  cd: 45,  dmg: 55,  kind: 'cleave', desc: 'Wide heavy swing' },
  slam:   { name: 'Ground Slam', cls: 'Warrior', color: '#e0a060', cost: 12, cd: 150, dmg: 135, kind: 'ring',   desc: 'Shockwave around you' },
  whirl:  { name: 'Whirlwind',   cls: 'Warrior', color: '#ff7a4a', cost: 16, cd: 210, dmg: 165, kind: 'whirl',  desc: 'Hit everything close' },
  leap:   { name: 'Heroic Leap', cls: 'Warrior', color: '#ffb84a', cost: 22, cd: 300, dmg: 230, kind: 'leap',   desc: 'Jump to cursor & slam' },
  // HUNTER — ranged, lower damage, fast cooldowns
  multishot: { name: 'Multishot',    cls: 'Hunter', color: '#8fe0a0', cost: 6,  cd: 30,  dmg: 20,  kind: 'spread', desc: 'Fan of 3 arrows' },
  pierce:    { name: 'Piercing Shot',cls: 'Hunter', color: '#a0e0c0', cost: 8,  cd: 45,  dmg: 36,  kind: 'pierce', desc: 'Arrow pierces all' },
  rapid:     { name: 'Rapid Fire',   cls: 'Hunter', color: '#d0f0b0', cost: 12, cd: 90,  dmg: 26,  kind: 'burst',  desc: 'Quick 5-arrow barrage' },
  rain:      { name: 'Arrow Rain',   cls: 'Hunter', color: '#bfe6a0', cost: 20, cd: 240, dmg: 150, kind: 'rain',   desc: 'Big volley at cursor' },
  // MAGE — ranged spell power, scales hard with INT
  fireball: { name: 'Fireball',       cls: 'Mage', color: '#ff7a3c', cost: 10, cd: 36,  dmg: 42,  kind: 'fireball', desc: 'Explosive bolt' },
  chain:    { name: 'Chain Lightning',cls: 'Mage', color: '#c9a0ff', cost: 14, cd: 66,  dmg: 58,  kind: 'chain',    desc: 'Arcs between foes' },
  frost:    { name: 'Frost Nova',     cls: 'Mage', color: '#7fd8ff', cost: 20, cd: 180, dmg: 120, kind: 'nova',     desc: 'Freeze & slow nearby' },
  meteor:   { name: 'Meteor',         cls: 'Mage', color: '#ff5c3c', cost: 34, cd: 360, dmg: 300, kind: 'meteor',   desc: 'Massive AoE nuke' },
};
// Order in which a class learns its spells (slot Q,W,E,R).
const CLASS_SPELLS = {
  Warrior: ['cleave', 'slam', 'whirl', 'leap'],
  Hunter:  ['multishot', 'pierce', 'rapid', 'rain'],
  Mage:    ['fireball', 'chain', 'frost', 'meteor'],
};
const KEY_ORDER = ['q', 'w', 'e', 'r'];
let projectiles = [], meteors = [], fx = [];

function spellStatFor(def) { const p = { Warrior: 'STR', Hunter: 'AGI', Mage: 'INT' }[def.cls]; return player.attrs[p] || 0; }
// Spell damage scales with your class PRIMARY stat and with Spell Power (secondary).
function spellDamage(inst, def) {
  const lvl = 1 + 0.25 * (inst.level - 1);
  return Math.round((def.dmg + spellStatFor(def) * 1.1 + (player.spellPower || 0) * 0.9) * lvl);
}
// Cooldown drops slightly with spell level and is further reduced by Spell Haste.
function spellCooldown(inst, def) {
  const haste = player.stats.hasteMult || 1;
  return Math.max(4, Math.round(def.cd * Math.max(0.7, 1 - 0.04 * (inst.level - 1)) * haste));
}

function castSpell(i) {
  if (game.menu || game.over || showInv) return;
  const inst = player.spells[i]; if (!inst || inst.cd > 0) return;
  const def = SPELL_LIB[inst.id];
  if (player.mana < def.cost) { player.manaFlash = 10; return; }
  player.mana -= def.cost; inst.cd = spellCooldown(inst, def);
  const roll = rollCrit(spellDamage(inst, def));
  castEffect(def, roll.dmg, roll.crit);
}

// ---- effect helpers ----
function fireArrow(angle, dmg, color, pierce, speed, crit) {
  const sp = speed || 9;
  projectiles.push({ x: player.x + Math.cos(angle) * 18, y: player.y + Math.sin(angle) * 18,
    vx: Math.cos(angle) * sp, vy: Math.sin(angle) * sp, life: pierce ? 95 : 80, r: 4,
    dmg, crit, color: crit ? '#ffd35c' : color, kind: pierce ? 'pierce' : 'arrow', hitSet: pierce ? new Set() : null });
}
function effectArc(color, dmg, reach, arc, crit) {
  attack.active = true; attack.t = 0; attack.dir = player.facing; attack.arc = arc; attack.reach = reach; attack.color = crit ? '#ffd35c' : color;
  for (const e of enemies) { if (e.dead) continue;
    const dx = e.x - player.x, dy = e.y - player.y, dist = Math.hypot(dx, dy); if (dist > reach + e.radius) continue;
    const ang = Math.atan2(dy, dx);
    if (Math.abs(normalizeAngle(ang - player.facing)) <= arc / 2) { const kb = e.boss ? 4 : 14; e.x += Math.cos(ang) * kb; e.y += Math.sin(ang) * kb; hurtEnemy(e, dmg, crit); } }
}
function effectRing(color, dmg, R, slow, crit) {
  fx.push({ kind: 'nova', x: player.x, y: player.y, r: R, life: 22, maxLife: 22, color });
  for (const e of enemies) { if (e.dead) continue; if (Math.hypot(e.x - player.x, e.y - player.y) < R + e.radius) { hurtEnemy(e, dmg, crit); if (slow) e.slowT = 150; } }
}
function effectLeap(color, dmg, crit) {
  const tx = clamp(mouse.x, ROOM.left + player.radius, ROOM.right - player.radius), ty = clamp(mouse.y, ROOM.top + player.radius, ROOM.bottom - player.radius);
  player.x = tx; player.y = ty;
  fx.push({ kind: 'boom', x: tx, y: ty, r: 92, life: 18, maxLife: 18, color });
  damageInRadius(tx, ty, 92, dmg, crit);
}
function effectChain(color, dmg, crit) {
  let src = { x: player.x, y: player.y }; let pool = enemies.filter(e => !e.dead);
  for (let i = 0; i < 4; i++) {
    let best = null, bd = 1e9; const range = i === 0 ? 360 : 160;
    for (const e of pool) { const d = Math.hypot(e.x - src.x, e.y - src.y); if (d < range && d < bd) { bd = d; best = e; } }
    if (!best) break;
    fx.push({ kind: 'bolt', x1: src.x, y1: src.y, x2: best.x, y2: best.y, life: 10, color });
    hurtEnemy(best, Math.round(dmg * (1 - i * 0.15)), crit); pool = pool.filter(e => e !== best); src = { x: best.x, y: best.y };
  }
  if (enemies.filter(e => !e.dead).length === 0) fx.push({ kind: 'bolt', x1: player.x, y1: player.y, x2: mouse.x, y2: mouse.y, life: 10, color });
}
function spawnMeteor(dmg, R, color, crit) {
  const tx = clamp(mouse.x, ROOM.left + 20, ROOM.right - 20), ty = clamp(mouse.y, ROOM.top + 20, ROOM.bottom - 20);
  meteors.push({ x: tx, y: ty, timer: 34, r: R, dmg, crit, color });
}
function castEffect(def, dmg, crit) {
  switch (def.kind) {
    case 'cleave': effectArc(def.color, dmg, 96, 1.8, crit); break;
    case 'whirl':  effectRing(def.color, dmg, 86, false, crit); break;
    case 'ring':   effectRing(def.color, dmg, 128, false, crit); break;
    case 'leap':   effectLeap(def.color, dmg, crit); break;
    case 'spread': [-0.24, 0, 0.24].forEach(o => fireArrow(player.facing + o, dmg, def.color, false, undefined, crit)); break;
    case 'burst':  for (let i = 0; i < 5; i++) fireArrow(player.facing + (Math.random() - 0.5) * 0.2, dmg, def.color, false, 9 + Math.random() * 2, crit); break;
    case 'pierce': fireArrow(player.facing, dmg, def.color, true, 11, crit); break;
    case 'rain':   spawnMeteor(dmg, 82, def.color, crit); break;
    case 'fireball': projectiles.push({ x: player.x + Math.cos(player.facing) * 20, y: player.y + Math.sin(player.facing) * 20,
      vx: Math.cos(player.facing) * 7.2, vy: Math.sin(player.facing) * 7.2, life: 80, r: 7, dmg, crit, splash: 46, color: def.color, kind: 'fireball' }); break;
    case 'nova':   effectRing(def.color, dmg, 118, true, crit); break;
    case 'chain':  effectChain(def.color, dmg, crit); break;
    case 'meteor': spawnMeteor(dmg, 94, def.color, crit); break;
  }
}

// ---- learning / leveling spells ----
let groundTomes = [];
function addTome(x, y) { groundTomes.push({ x: clamp(x, ROOM.left + 12, ROOM.right - 12), y: clamp(y, ROOM.top + 12, ROOM.bottom - 12), bob: Math.random() * Math.PI * 2 }); }
function grantSpell() {
  if (!player.class) return;
  const pool = CLASS_SPELLS[player.class.name];
  const known = new Set(player.spells.map(s => s.id));
  const next = pool.find(id => !known.has(id));
  if (next && player.spells.length < 4) {
    player.spells.push({ id: next, level: 1, cd: 0 });
    fx.push({ kind: 'toast', text: `New spell: ${SPELL_LIB[next].name}  (${keyDisplay(spellKey(player.spells.length - 1))})`, life: 150, maxLife: 150 });
  } else {
    const s = player.spells[Math.floor(Math.random() * player.spells.length)];
    s.level++;
    fx.push({ kind: 'toast', text: `${SPELL_LIB[s.id].name} → Level ${s.level}`, life: 150, maxLife: 150 });
  }
}

// --------------------------------------------------------------------
//  BASIC ATTACK (weapon-based: melee swing or bow shot)
// --------------------------------------------------------------------
const attack = { active: false, t: 0, duration: 12, cooldown: 0, cooldownMax: 20, reach: 46, arc: 0.6, color: '#dbe7f5', ranged: false, dir: 0 };
function tryAttack() {
  if (game.menu || game.over || showInv || attack.cooldown > 0) return;
  attack.cooldown = attack.cooldownMax;
  const roll = rollCrit(player.stats.attackDamage);
  if (player.weapon.ranged) {
    // Bow: fire an arrow toward the cursor
    const sp = 9;
    projectiles.push({ x: player.x + Math.cos(player.facing) * 18, y: player.y + Math.sin(player.facing) * 18,
      vx: Math.cos(player.facing) * sp, vy: Math.sin(player.facing) * sp, life: 70, r: 4,
      dmg: roll.dmg, crit: roll.crit, color: roll.crit ? '#ffd35c' : player.weapon.color, kind: 'arrow' });
  } else {
    // Melee: animated swing arc, damages everything in the arc now
    attack.active = true; attack.t = 0; attack.dir = player.facing;
    attack.arc = player.weapon.arc; attack.reach = player.weapon.reach; attack.color = roll.crit ? '#ffd35c' : player.weapon.color;
    for (const e of enemies) {
      if (e.dead) continue;
      const dx = e.x - player.x, dy = e.y - player.y, dist = Math.hypot(dx, dy);
      if (dist > attack.reach + e.radius) continue;
      const ang = Math.atan2(dy, dx);
      if (Math.abs(normalizeAngle(ang - attack.dir)) <= attack.arc / 2) {
        const kb = e.boss ? 3 : 10; e.x += Math.cos(ang) * kb; e.y += Math.sin(ang) * kb;
        hurtEnemy(e, roll.dmg, roll.crit);
      }
    }
  }
}

// --------------------------------------------------------------------
//  ENEMY DAMAGE + DEATH + DROPS
// --------------------------------------------------------------------
// Rolls a crit against the player's current crit stats. Returns final damage + crit flag.
function rollCrit(base) {
  const crit = Math.random() < player.stats.critChance;
  return { dmg: Math.round(crit ? base * player.stats.critDamage : base), crit };
}
function popDmg(x, y, amount, crit) {
  fx.push({ kind: 'dmgtext', x, y, text: String(amount), crit: !!crit, life: 42, maxLife: 42 });
}
function hurtEnemy(e, dmg, crit) {
  if (e.dead) return;
  e.hp -= dmg; e.hitFlash = 8;
  popDmg(e.x, e.y - e.radius - 4, dmg, crit);
  if (e.hp <= 0) { e.dead = true; game.kills++; dropForEnemy(e); }
}
function dropForEnemy(e) {
  if (e.boss) {
    dropLoot(e.x, e.y, 4 + Math.floor(game.level / 5), 2, true);
    dropPotion(e.x, e.y, 2, 'health'); dropPotion(e.x, e.y, 2, 'mana');
    addTome(e.x, e.y); // bosses always drop a spell tome
  } else {
    if (Math.random() < 0.68) dropLoot(e.x, e.y, 1, 0, false);
    if (Math.random() < 0.16) dropPotion(e.x, e.y, 1, 'health');
    if (Math.random() < 0.12) dropPotion(e.x, e.y, 1, 'mana');
    if (Math.random() < 0.03) addTome(e.x, e.y); // rare spell tome from mobs
  }
}
function damageInRadius(x, y, r, dmg, crit) {
  for (const e of enemies) { if (e.dead) continue; if (Math.hypot(e.x - x, e.y - y) < r + e.radius) hurtEnemy(e, dmg, crit); }
}

// --------------------------------------------------------------------
//  LOOT + POTIONS ON GROUND
// --------------------------------------------------------------------
let groundLoot = [], groundPotions = [];
function dropLoot(x, y, count, minIdx, boss) {
  for (let i = 0; i < count; i++) {
