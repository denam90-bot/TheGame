  ctx.fillStyle = REG.floor; ctx.fillRect(ROOM.left, ROOM.top, ROOM.right-ROOM.left, ROOM.bottom-ROOM.top);
  ctx.strokeStyle = REG.grid; ctx.lineWidth = 1;
  for (let x = ROOM.left; x < ROOM.right; x += 45) { ctx.beginPath(); ctx.moveTo(x, ROOM.top); ctx.lineTo(x, ROOM.bottom); ctx.stroke(); }
  for (let y = ROOM.top; y < ROOM.bottom; y += 45) { ctx.beginPath(); ctx.moveTo(ROOM.left, y); ctx.lineTo(ROOM.right, y); ctx.stroke(); }

  for (const p of props) drawProp(p, REG);

  ctx.fillStyle = game.isBoss ? '#4a2f3a' : REG.wall;
  ctx.fillRect(0, 0, W, WALL); ctx.fillRect(0, H - WALL, W, WALL); ctx.fillRect(0, 0, WALL, H); ctx.fillRect(W - WALL, 0, WALL, H);
  ctx.strokeStyle = game.isBoss ? '#7a4b5c' : REG.wallEdge; ctx.lineWidth = 2;
  ctx.strokeRect(ROOM.left, ROOM.top, ROOM.right-ROOM.left, ROOM.bottom-ROOM.top);

  if (moveTarget) { ctx.strokeStyle = 'rgba(150,200,255,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(moveTarget.x, moveTarget.y, 8, 0, Math.PI*2); ctx.stroke(); }

  if (game.cleared) {
    const dy = DOOR.cy - DOOR.h / 2; const pulse = 0.5 + 0.5 * Math.sin(game.time * 0.12);
    ctx.fillStyle = '#20130a'; ctx.fillRect(W - WALL, dy, WALL, DOOR.h);
    ctx.save(); ctx.shadowColor = '#ffcf5c'; ctx.shadowBlur = 14 + pulse * 12;
    ctx.strokeStyle = `rgba(255,207,92,${0.7 + pulse*0.3})`; ctx.lineWidth = 3; ctx.strokeRect(W - WALL + 1, dy + 1, WALL - 2, DOOR.h - 2); ctx.restore();
    ctx.fillStyle = '#ffcf5c'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'right'; ctx.fillText('EXIT →', W - WALL - 10, dy - 8); ctx.textAlign = 'start';
  }

  for (const m of meteors) {
    const prog = 1 - m.timer / 34; const rr = m.r * (0.4 + prog*0.6);
    ctx.strokeStyle = `rgba(255,90,60,${0.4 + prog*0.5})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(m.x, m.y, rr, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = `rgba(255,120,60,${0.10 + prog*0.15})`; ctx.beginPath(); ctx.arc(m.x, m.y, rr, 0, Math.PI*2); ctx.fill();
  }

  for (const p of groundPotions) { const yb = p.y + Math.sin(game.time * 0.08 + p.bob) * 3; ctx.save(); ctx.shadowColor = p.type === 'mana' ? '#3b7de2' : '#e23b4e'; ctx.shadowBlur = 10; drawPotionIcon(p.x, yb, 6, p.type); ctx.restore(); }
  for (const g of groundLoot) { const yb = g.y + Math.sin(game.time * 0.08 + g.bob) * 3; ctx.save(); ctx.shadowColor = g.item.rarity.color; ctx.shadowBlur = 12; drawGem(g.x, yb, g.item.rarity.color, 7); ctx.restore(); }
  for (const tm of groundTomes) { const yb = tm.y + Math.sin(game.time * 0.08 + tm.bob) * 3; ctx.save(); ctx.shadowColor = '#c9a0ff'; ctx.shadowBlur = 14; drawTome(tm.x, yb); ctx.restore(); }

  let boss = null;
  for (const e of enemies) {
    if (e.boss) boss = e;
    ctx.globalAlpha = e.spawnFx > 0 ? 0.4 + (18 - e.spawnFx)/18*0.6 : 1;
    let col = e.boss ? REG.boss : REG.enemy;
    if (e.hitFlash > 0) col = e.boss ? '#ffb35c' : REG.enemyHit; else if (e.slowT > 0) col = e.boss ? '#7a6fb0' : '#6f86b5';
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2); ctx.fill();
    if (e.boss) { ctx.strokeStyle = '#ffd35c'; ctx.lineWidth = 3; ctx.stroke(); }
    else { ctx.globalAlpha = 1; drawBar(e.x - 20, e.y - e.radius - 10, 40, 4, e.hp / e.maxHp, '#6fcf5f'); }
    ctx.globalAlpha = 1;
  }

  // Projectiles: fireball orb / arrow shaft
  for (const p of projectiles) {
    if (p.kind === 'arrow' || p.kind === 'pierce') {
      const a = Math.atan2(p.vy, p.vx); ctx.strokeStyle = p.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - Math.cos(a)*14, p.y - Math.sin(a)*14); ctx.stroke();
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.save(); ctx.shadowColor = p.color; ctx.shadowBlur = 14; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); ctx.restore();
    }
  }

  for (const f of fx) {
    const t = f.life / f.maxLife;
    if (f.kind === 'nova') { ctx.strokeStyle = `rgba(127,216,255,${t})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 - t) + 8, 0, Math.PI*2); ctx.stroke(); }
    else if (f.kind === 'boom') { ctx.fillStyle = `rgba(255,140,70,${0.5 * t})`; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 - t*0.4), 0, Math.PI*2); ctx.fill(); }
    else if (f.kind === 'bolt') { ctx.strokeStyle = f.color; ctx.lineWidth = 2 + 2*t; ctx.globalAlpha = 0.5 + 0.5*t;
      ctx.beginPath(); ctx.moveTo(f.x1, f.y1); const mx2=(f.x1+f.x2)/2+(Math.random()-0.5)*16, my2=(f.y1+f.y2)/2+(Math.random()-0.5)*16; ctx.lineTo(mx2,my2); ctx.lineTo(f.x2, f.y2); ctx.stroke(); ctx.globalAlpha = 1; }
    else if (f.kind === 'toast') { ctx.globalAlpha = clamp(f.life / 45, 0, 1); ctx.fillStyle = '#ffe08a'; ctx.font = 'bold 17px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(f.text, W / 2, 138); ctx.textAlign = 'start'; ctx.globalAlpha = 1; }
    else if (f.kind === 'dmgtext') {
      const rise = (1 - t) * 24; ctx.globalAlpha = clamp(t * 1.3, 0, 1); ctx.textAlign = 'center';
      if (f.crit) { ctx.fillStyle = '#ffd35c'; ctx.font = 'bold 18px sans-serif'; ctx.fillText(f.text + '!', f.x, f.y - rise); }
      else { ctx.fillStyle = '#e8eef6'; ctx.font = 'bold 12px sans-serif'; ctx.fillText(f.text, f.x, f.y - rise); }
      ctx.textAlign = 'start'; ctx.globalAlpha = 1;
    }
  }

  // Melee swing animation
  if (attack.active) {
    const prog = attack.t / attack.duration;
    const a0 = attack.dir - attack.arc / 2, cur = a0 + attack.arc * prog;
    ctx.fillStyle = `rgba(200,220,255,${0.26*(1-prog)+0.05})`;
    ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.arc(player.x, player.y, attack.reach, a0, cur); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = attack.color; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(player.x + Math.cos(cur)*attack.reach, player.y + Math.sin(cur)*attack.reach); ctx.stroke();
  }

  // Player
  ctx.fillStyle = player.hitFlash > 0 ? '#ff5c5c' : (player.healFlash > 0 ? '#5fe08b' : '#4a90d9');
  ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#dbe7f5'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(player.x, player.y);
  ctx.lineTo(player.x + Math.cos(player.facing)*(player.radius+8), player.y + Math.sin(player.facing)*(player.radius+8)); ctx.stroke();

  if (boss) {
    const bw = Math.min(520, W - 80), bx = (W - bw) / 2, by = 40;
    drawBar(bx, by, bw, 14, boss.hp / boss.maxHp, '#e0483d');
    ctx.strokeStyle = '#ffd35c'; ctx.lineWidth = 2; ctx.strokeRect(bx, by, bw, 14);
    ctx.fillStyle = '#ffd35c'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(`BOSS — Level ${game.level}`, W / 2, by - 6); ctx.textAlign = 'start';
  }

  drawHUD();
  if (game.cleared) {
    ctx.fillStyle = 'rgba(30,40,30,.85)'; ctx.fillRect(W/2 - 230, ROOM.top + 8, 460, 30);
    ctx.strokeStyle = '#5fe08b'; ctx.lineWidth = 1; ctx.strokeRect(W/2 - 230, ROOM.top + 8, 460, 30);
    ctx.fillStyle = '#8be08b'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Room cleared — grab the ✦ spell tome & loot, then take the door →', W/2, ROOM.top + 28); ctx.textAlign = 'start';
  }
  if (showInv) drawInventory();
  if (mergeOpen) drawMerge();
  if (game.over) {
    ctx.fillStyle = 'rgba(0,0,0,.68)'; ctx.fillRect(0, 0, W, H); ctx.textAlign = 'center';
    ctx.fillStyle = '#e8eef6'; ctx.font = 'bold 34px sans-serif'; ctx.fillText('You died', W/2, H/2 - 14);
    ctx.font = '16px sans-serif'; ctx.fillText(`Reached level ${game.level} · ${game.kills} kills`, W/2, H/2 + 16);
    ctx.fillText('Press R or click to restart · C to change class', W/2, H/2 + 44); ctx.textAlign = 'start';
  }
  if (settingsOpen) drawSettings();
  if (isTouch && !game.menu && !game.over && !showInv && !settingsOpen && !mergeOpen) drawTouchUI();
  drawRegionBanner();
}

// Big fade-in/out title when you step into a new region.
function drawRegionBanner() {
  const b = game.banner; if (!b || b.t <= 0) return;
  if (!showInv && !settingsOpen && !mergeOpen && !game.menu && !game.over) b.t--;
  const R = currentRegion();
  const a = Math.min(1, b.t / 45);
  ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, H * 0.28, W, 116);
  ctx.strokeStyle = R.accent; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W * 0.12, H * 0.28); ctx.lineTo(W * 0.88, H * 0.28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W * 0.12, H * 0.28 + 116); ctx.lineTo(W * 0.88, H * 0.28 + 116); ctx.stroke();
  ctx.fillStyle = R.accent; ctx.font = 'bold 30px sans-serif';
  ctx.fillText(b.name + (b.loop > 0 ? '  ·  Cycle ' + (b.loop + 1) : ''), W / 2, H * 0.28 + 44);
  ctx.fillStyle = '#cfd4dc'; ctx.font = '14px sans-serif'; ctx.fillText(b.tag, W / 2, H * 0.28 + 68);
  ctx.fillStyle = '#8f97a3'; ctx.font = 'italic 12px sans-serif'; ctx.fillText(b.blurb, W / 2, H * 0.28 + 92);
  ctx.textAlign = 'start'; ctx.restore();
}

// Draws the on-screen touch controls: joystick, attack, spells, potions, inventory, settings.
function drawTouchUI() {
  ctx.save();
  if (touchMove.active) {
    ctx.globalAlpha = 0.5; ctx.strokeStyle = '#9fd0ff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(joyOrigin.x, joyOrigin.y, 60, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(159,208,255,.35)'; ctx.beginPath(); ctx.arc(joyKnob.x, joyKnob.y, 28, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function roundBtn(x, y, r, label, color, sub) {
    ctx.fillStyle = 'rgba(14,17,22,.72)'; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.font = 'bold ' + Math.round(r * 0.7) + 'px sans-serif'; ctx.fillText(label, x, y + r * 0.24);
    if (sub) { ctx.fillStyle = '#9aa0a8'; ctx.font = '10px sans-serif'; ctx.fillText(sub, x, y + r * 0.85); }
    ctx.textAlign = 'start';
  }
  const B = {}; for (const b of touchButtons()) B[b.id] = b;
  roundBtn(B.attack.x, B.attack.y, B.attack.r, '⚔', '#ff8a5c');
  roundBtn(B.potionH.x, B.potionH.y, B.potionH.r, 'H', '#e2647a', player.potions + '/' + POTION_CAP);
  roundBtn(B.potionM.x, B.potionM.y, B.potionM.r, 'M', '#5a8fe2', player.manaPotions + '/' + MANA_POTION_CAP);
  roundBtn(B.inv.x, B.inv.y, B.inv.r, 'I', '#cfd4dc');
  roundBtn(B.settings.x, B.settings.y, B.settings.r, '⚙', '#cfd4dc');
  for (let i = 0; i < 4; i++) {
    const b = spellBtn(i), inst = player.spells[i];
    ctx.fillStyle = 'rgba(14,17,22,.72)'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    if (!inst) { ctx.strokeStyle = '#242830'; ctx.lineWidth = 2; ctx.stroke(); ctx.fillStyle = '#3a3f48'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('lock', b.x, b.y + 3); ctx.textAlign = 'start'; continue; }
    const def = SPELL_LIB[inst.id], aff = player.mana >= def.cost;
    ctx.strokeStyle = aff ? def.color : '#3a3f48'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = aff ? def.color : '#5a5f68'; ctx.textAlign = 'center'; ctx.font = '9px sans-serif'; ctx.fillText(def.name, b.x, b.y + 1);
    ctx.fillStyle = '#ffe08a'; ctx.font = 'bold 8px sans-serif'; ctx.fillText('L' + inst.level, b.x, b.y + 12);
    if (inst.cd > 0) { const fr = inst.cd / spellCooldown(inst, def); ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.arc(b.x, b.y, b.r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * fr); ctx.closePath(); ctx.fill(); }
    ctx.textAlign = 'start';
  }
  ctx.restore();
}

function drawSettings() {
  settingsRects = [];
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
  const pw = 380, ph = isTouch ? 424 : 372, px = (W - pw) / 2, py = (H - ph) / 2;
  ctx.fillStyle = 'rgba(12,14,20,.98)'; ctx.fillRect(px, py, pw, ph);
  ctx.strokeStyle = '#3a4150'; ctx.lineWidth = 2; ctx.strokeRect(px, py, pw, ph);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#e8eef6'; ctx.font = 'bold 17px sans-serif'; ctx.fillText('Settings — Keybinds', px + 18, py + 30);
  ctx.fillStyle = '#f2c14e'; ctx.font = '12px sans-serif'; ctx.textAlign = 'right'; ctx.fillText('Esc to close', px + pw - 16, py + 30); ctx.textAlign = 'left';
  ctx.fillStyle = '#7f8794'; ctx.font = '11px sans-serif'; ctx.fillText('Click a row, then press the new key (Esc cancels).', px + 18, py + 50);
  let yy = py + 80;
  BIND_ROWS.forEach(row => {
    const rx = px + 16, rw = pw - 32, rh = 30;
    const hover = mouse.x >= rx && mouse.x <= rx + rw && mouse.y >= yy - 20 && mouse.y <= yy - 20 + rh;
    const waiting = awaitingBind === row.id;
    settingsRects.push({ x: rx, y: yy - 20, w: rw, h: rh, id: row.id });
    ctx.fillStyle = waiting ? '#2a3550' : (hover ? '#20242e' : '#171a21'); ctx.fillRect(rx, yy - 20, rw, rh);
    ctx.strokeStyle = '#2a2f38'; ctx.lineWidth = 1; ctx.strokeRect(rx, yy - 20, rw, rh);
    let label = row.label;
    const si = row.id.startsWith('spell') ? +row.id.slice(5) : -1;
    if (si >= 0 && player.spells[si]) label = `Spell ${si + 1} · ${SPELL_LIB[player.spells[si].id].name}`;
    ctx.fillStyle = '#cfd4dc'; ctx.font = '13px sans-serif'; ctx.fillText(label, rx + 12, yy - 1);
    ctx.fillStyle = waiting ? '#ffe08a' : '#9fd0ff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(waiting ? 'press a key…' : keyDisplay(binds[row.id]), rx + rw - 12, yy - 1); ctx.textAlign = 'left';
    yy += 36;
  });
  // Touch-only: movement mode toggle (floating joystick vs tap-to-move)
  if (isTouch) {
    const rx = px + 16, rw = pw - 32, rh = 34, ry = yy - 20;
    const hov = mouse.x >= rx && mouse.x <= rx + rw && mouse.y >= ry && mouse.y <= ry + rh;
    settingsRects.push({ x: rx, y: ry, w: rw, h: rh, id: '__touchmode' });
    ctx.fillStyle = hov ? '#20242e' : '#171a21'; ctx.fillRect(rx, ry, rw, rh);
    ctx.strokeStyle = '#3a4150'; ctx.lineWidth = 1; ctx.strokeRect(rx, ry, rw, rh);
    ctx.fillStyle = '#cfd4dc'; ctx.font = '13px sans-serif'; ctx.fillText('Movement (tap to switch)', rx + 12, ry + 21);
    ctx.fillStyle = '#9fd0ff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(touchMoveMode === 'joystick' ? 'Joystick' : 'Tap-to-move', rx + rw - 12, ry + 21); ctx.textAlign = 'left';
    yy += 44;
  }
  const bxr = px + 16, bwr = pw - 32, bhr = 30, byr = yy - 12;
  const bhover = mouse.x >= bxr && mouse.x <= bxr + bwr && mouse.y >= byr && mouse.y <= byr + bhr;
  settingsRects.push({ x: bxr, y: byr, w: bwr, h: bhr, id: '__reset' });
  ctx.fillStyle = bhover ? '#3a2530' : '#241a1f'; ctx.fillRect(bxr, byr, bwr, bhr);
  ctx.strokeStyle = '#7a4b5c'; ctx.lineWidth = 1; ctx.strokeRect(bxr, byr, bwr, bhr);
  ctx.fillStyle = '#ff9a9a'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Reset to defaults', px + pw / 2, byr + 20); ctx.textAlign = 'left';
}

function drawHUD() {
  drawBar(16, 16, 220, 14, player.hp / player.maxHp, '#e0483d');
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.strokeRect(16, 16, 220, 14);
  ctx.fillStyle = '#fff'; ctx.font = '11px sans-serif'; ctx.fillText(`${Math.ceil(player.hp)}/${player.maxHp}`, 100, 27);
  drawBar(16, 33, 220, 10, player.mana / player.maxMana, player.manaFlash > 0 ? '#7fb8ff' : '#3b7de2');
  ctx.strokeStyle = '#000'; ctx.strokeRect(16, 33, 220, 10);
  ctx.fillStyle = '#cfe0ff'; ctx.font = '9px sans-serif'; ctx.fillText(`${Math.ceil(player.mana)}/${player.maxMana}`, 104, 42);

  drawPotionIcon(28, 60, 6, 'health'); ctx.fillStyle = player.potions >= POTION_CAP ? '#ffcf5c' : '#cfd4dc'; ctx.font = '12px sans-serif'; ctx.fillText(`${player.potions}/${POTION_CAP} (1)`, 40, 64);
  drawPotionIcon(120, 60, 6, 'mana'); ctx.fillStyle = player.manaPotions >= MANA_POTION_CAP ? '#ffcf5c' : '#cfd4dc'; ctx.fillText(`${player.manaPotions}/${MANA_POTION_CAP} (2)`, 132, 64);
  const a = player.attrs;
  const prim = player.class ? player.class.primary : null;
  ctx.fillStyle = '#d7c98a';
  ctx.fillText(`${player.class ? player.class.name + '  ·  ' : ''}${PRIMARY_STATS.map(s => `${s} ${a[s]}${s === prim ? '★' : ''}`).join('  ')}`, 16, 82);
  const wk = player.weapon.key, wdef = WEAPONS[wk] || {};
  ctx.fillStyle = '#cfd4dc';
  ctx.fillText(`AtkDmg ${player.stats.attackDamage}  AtkSpd ${player.stats.attacksPerSec.toFixed(2)}/s  ARM ${player.stats.armor}  [${wk}${wdef.twoHanded ? ' · 2H' : ''}${wdef.caster ? ' · caster' : ''}${player.weapon.ranged ? ' · ranged' : ''}]`, 16, 98);
  ctx.fillStyle = '#ffcf5c';
  ctx.fillText(`Crit ${Math.round(player.stats.critChance * 100)}%  ·  CritDmg ${Math.round(player.stats.critDamage * 100)}%  ·  SpellPwr ${player.spellPower}  ·  SpellHaste ${player.stats.spellHaste || 0}%  ·  AtkSpd +${player.stats.atkSpeedBonus || 0}%`, 16, 114);

  const REG = currentRegion();
  ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'right';
  ctx.fillStyle = REG.accent;
  ctx.fillText(`${REG.name}  ${levelInRegion()}/${REGION_LEVELS}${regionLoop() > 0 ? '  ·  Cycle ' + (regionLoop() + 1) : ''}`, W - 34, 26);
  ctx.fillStyle = game.isBoss ? '#ffb35c' : '#cfd4dc'; ctx.fillText(`Level ${game.level}${game.isBoss ? ' · BOSS' : ''}`, W - 34, 46);
  ctx.fillStyle = '#cfd4dc'; ctx.fillText(`Enemies: ${enemies.length + spawnQueue.length}   Items: ${player.inventory.length} (I)`, W - 34, 66);
  ctx.textAlign = 'start';

  if (isTouch) return; // on touch, spells are drawn as round buttons in drawTouchUI()
  const bx = 16, by = H - 62, sz = 46, gap = 8;
  [0, 1, 2, 3].forEach(i => {
    const key = spellKey(i);
    const x = bx + i * (sz + gap);
    const inst = player.spells[i];
    ctx.fillStyle = '#0e1116'; ctx.fillRect(x, by, sz, sz);
    if (!inst) {
      ctx.strokeStyle = '#242830'; ctx.lineWidth = 2; ctx.strokeRect(x, by, sz, sz);
      ctx.fillStyle = '#3a3f48'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(keyDisplay(key), x + sz/2, by + 22);
      ctx.font = '8px sans-serif'; ctx.fillText('locked', x + sz/2, by + 34); ctx.textAlign = 'start'; return;
    }
    const def = SPELL_LIB[inst.id]; const affordable = player.mana >= def.cost;
    ctx.strokeStyle = affordable ? def.color : '#3a3f48'; ctx.lineWidth = 2; ctx.strokeRect(x, by, sz, sz);
    ctx.fillStyle = affordable ? def.color : '#5a5f68'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(keyDisplay(key), x + 12, by + 18);
    ctx.fillStyle = '#ffe08a'; ctx.font = 'bold 9px sans-serif'; ctx.fillText(`L${inst.level}`, x + sz - 12, by + 16);
    ctx.fillStyle = '#8f97a3'; ctx.font = '8px sans-serif'; ctx.fillText(def.name, x + sz/2, by + 33);
    ctx.fillStyle = '#6fa8ff'; ctx.fillText(`${def.cost}mp · ${(spellCooldown(inst, def) / 60).toFixed(1)}s`, x + sz/2, by + 43);
    if (inst.cd > 0) { const frac = inst.cd / spellCooldown(inst, def); ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x, by + sz*(1-frac), sz, sz*frac); }
    ctx.textAlign = 'start';
  });
}

function drawInventory() {
  invRects = [];
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
  const px = 40, py = 40, pw = W - 80, ph = H - 80;
  invPanel.x = px; invPanel.y = py; invPanel.w = pw; invPanel.h = ph;
  ctx.fillStyle = 'rgba(12,14,20,.98)'; ctx.fillRect(px, py, pw, ph);
  ctx.strokeStyle = '#3a4150'; ctx.lineWidth = 2; ctx.strokeRect(px, py, pw, ph);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#e8eef6'; ctx.font = 'bold 20px sans-serif'; ctx.fillText('Inventory', px + 20, py + 32);
  ctx.fillStyle = salvageMode ? '#ff9a9a' : '#7f8794'; ctx.font = '12px sans-serif';
  ctx.fillText(salvageMode
    ? `SALVAGE MODE — tap a backpack item to destroy it for 1 shard  (${SHARD_COST} shards = 1 crafted item)`
    : (isTouch ? 'Tap an item to equip/unequip  ·  tap ✕ or outside to close'
               : 'Click an item to equip/unequip  ·  press I or ✕ to close'), px + 20, py + 52);

  // Big close button (works on tap and click)
  const cb = { x: px + pw - 52, y: py + 14, w: 40, h: 40, kind: 'close' };
  invRects.push(cb);
  ctx.fillStyle = '#241a1f'; ctx.fillRect(cb.x, cb.y, cb.w, cb.h);
  ctx.strokeStyle = '#7a4b5c'; ctx.lineWidth = 2; ctx.strokeRect(cb.x, cb.y, cb.w, cb.h);
  ctx.fillStyle = '#ff9a9a'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('✕', cb.x + cb.w / 2, cb.y + cb.h / 2 + 8); ctx.textAlign = 'left';

  // Forge + Salvage buttons
  const fb = { x: px + pw - 190, y: py + 16, w: 124, h: 36, kind: 'forgeOpen' };
  invRects.push(fb);
  ctx.fillStyle = '#3a2c12'; ctx.fillRect(fb.x, fb.y, fb.w, fb.h);
  ctx.strokeStyle = '#ffcf5c'; ctx.lineWidth = 2; ctx.strokeRect(fb.x, fb.y, fb.w, fb.h);
  ctx.fillStyle = '#ffcf5c'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('⚒  Forge', fb.x + fb.w / 2, fb.y + 24); ctx.textAlign = 'left';

  const sb = { x: px + pw - 330, y: py + 16, w: 132, h: 36, kind: 'salvageToggle' };
  invRects.push(sb);
  ctx.fillStyle = salvageMode ? '#4a1c22' : '#171a21'; ctx.fillRect(sb.x, sb.y, sb.w, sb.h);
  ctx.strokeStyle = salvageMode ? '#ff6b6b' : '#3a4150'; ctx.lineWidth = 2; ctx.strokeRect(sb.x, sb.y, sb.w, sb.h);
  ctx.fillStyle = salvageMode ? '#ff9a9a' : '#9aa0a8'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(salvageMode ? '✖ SALVAGING' : '✖ Salvage', sb.x + sb.w / 2, sb.y + 23); ctx.textAlign = 'left';

  const narrow = W < 700; // portrait: stack the two sections instead of side-by-side
  const colW = narrow ? pw - 40 : pw / 2 - 30;
  const leftX = px + 20, rightX = narrow ? px + 20 : px + pw / 2 + 10;
  const rowH = 40, top = py + 84;
  const bagTop = narrow ? top + 14 + SLOTS.length * rowH + 26 : top;

  function drawRow(x, yy, it, slotLabel, kind, ref) {
    invRects.push({ x, y: yy, w: colW, h: rowH - 6, kind, ref });
    ctx.fillStyle = '#171a21'; ctx.fillRect(x, yy, colW, rowH - 6);
    ctx.strokeStyle = '#23272f'; ctx.lineWidth = 1; ctx.strokeRect(x, yy, colW, rowH - 6);
    if (slotLabel) { ctx.fillStyle = '#6b7280'; ctx.font = 'bold 10px sans-serif'; ctx.fillText(slotLabel.toUpperCase(), x + 10, yy + 15); }
    const nameX = slotLabel ? x + 78 : x + 12;
    if (it) {
      ctx.fillStyle = it.rarity.color; ctx.font = 'bold 14px sans-serif'; ctx.fillText(it.name, nameX, yy + 15);
      // primary stat lines in gold, secondary lines in grey
      let sx = x + 12; ctx.font = '11px sans-serif';
      for (const [s, v] of [[it.stat, it.value], [it.bonusStat, it.bonusValue], [it.bonusStat2, it.bonusValue2], [it.bonusStat3, it.bonusValue3]]) {
        if (!s || !v) continue;
        const txt = statLabel(s, v) + '  ';
        ctx.fillStyle = isPrimaryStat(s) ? '#d7c98a' : '#8b93a0';
        ctx.fillText(txt, sx, yy + 30); sx += ctx.measureText(txt).width;
      }
      if (isTwoHanded(it)) { ctx.fillStyle = '#7a5b2a'; ctx.fillText('· 2H', sx, yy + 30); }
    } else if (slotLabel === 'Off-hand' && isTwoHanded(player.equipped.Weapon)) {
      ctx.fillStyle = '#7a5b2a'; ctx.font = 'italic 12px sans-serif'; ctx.fillText('— blocked: two-handed weapon —', nameX, yy + 15);
    } else { ctx.fillStyle = '#41474f'; ctx.font = '13px sans-serif'; ctx.fillText('— empty —', nameX, yy + 15); }
  }

  // Equipped (left column)
  ctx.fillStyle = '#e8eef6'; ctx.font = 'bold 15px sans-serif'; ctx.fillText('Equipped', leftX, top);
  let yy = top + 14;
  for (const slot of SLOTS) { drawRow(leftX, yy, player.equipped[slot], slot, 'slot', slot); yy += rowH; }

  // Backpack — scrollable (newest first)
  const fullList = player.inventory.slice().reverse();
  const total = fullList.length;
  let by = bagTop + 14;
  const maxRows = Math.max(1, Math.floor((py + ph - by - (salvageMode ? 62 : 20)) / rowH));
  invMaxRows = maxRows;
  const maxScroll = Math.max(0, total - maxRows);
  invScroll = clamp(invScroll, 0, maxScroll);
  ctx.fillStyle = '#e8eef6'; ctx.font = 'bold 15px sans-serif'; ctx.fillText(`Backpack (${total})`, rightX, bagTop);

  if (total > maxRows) {
    const suBtn = { x: rightX + colW - 76, y: bagTop - 18, w: 34, h: 24, kind: 'scrollUp' };
    const sdBtn = { x: rightX + colW - 38, y: bagTop - 18, w: 34, h: 24, kind: 'scrollDown' };
    for (const b of [suBtn, sdBtn]) {
      invRects.push(b);
      ctx.fillStyle = '#171a21'; ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = '#3a4150'; ctx.lineWidth = 1; ctx.strokeRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = '#cfd4dc'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(b.kind === 'scrollUp' ? '▲' : '▼', b.x + b.w / 2, b.y + 17); ctx.textAlign = 'left';
    }
  }
  if (total === 0) { ctx.fillStyle = '#7f8794'; ctx.font = '13px sans-serif'; ctx.fillText('Empty — go kill things.', rightX + 4, by + 16); }

  const visible = fullList.slice(invScroll, invScroll + maxRows);
  for (const it of visible) { drawRow(rightX, by, it, null, 'bag', it); by += rowH; }

  // Bulk salvage helpers (only while salvaging) — huge time-saver with a full backpack
  if (salvageMode) {
    const byy = py + ph - 48;
    [[0, 'Normal'], [1, 'Uncommon'], [2, 'Rare']].forEach(([ri, nm], i) => {
      const bw2 = Math.min(150, (colW - 16) / 3), bx2 = rightX + i * (bw2 + 8);
      const cnt = player.inventory.filter(x => RARITIES.indexOf(x.rarity) === ri).length;
      invRects.push({ x: bx2, y: byy, w: bw2, h: 32, kind: 'salvageAll', ref: ri });
      ctx.fillStyle = cnt ? '#2a1a1e' : '#171a21'; ctx.fillRect(bx2, byy, bw2, 32);
      ctx.strokeStyle = cnt ? '#7a4b5c' : '#2a2f38'; ctx.lineWidth = 1; ctx.strokeRect(bx2, byy, bw2, 32);
      ctx.fillStyle = cnt ? RARITIES[ri].color : '#4a4f58'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(`Salvage ${cnt} ${nm}`, bx2 + bw2 / 2, byy + 20); ctx.textAlign = 'left';
    });
    ctx.fillStyle = '#7f8794'; ctx.font = '10px sans-serif';
    ctx.fillText(`Shards: ${RARITIES.map((r, i) => r.name[0] + player.shards[i]).join('  ')}`, leftX, py + ph - 12);
  }

  if (total > maxRows) {
    ctx.fillStyle = '#6b7280'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(`${invScroll + 1}–${invScroll + visible.length} of ${total}  ·  scroll ▲▼ / wheel`, rightX + colW, py + ph - 8); ctx.textAlign = 'left';
    const trX = rightX + colW - 4, trY = bagTop + 14, trH = maxRows * rowH - 8;
    ctx.fillStyle = '#23272f'; ctx.fillRect(trX, trY, 4, trH);
    const thumbH = Math.max(18, trH * (maxRows / total));
    const thumbY = trY + (trH - thumbH) * (maxScroll ? invScroll / maxScroll : 0);
    ctx.fillStyle = '#4a90d9'; ctx.fillRect(trX, thumbY, 4, thumbH);
  }
}

function drawMerge() {
  mergeRects = [];
  if (mergeMsgT > 0) mergeMsgT--; else mergeMsg = mergeMsg && mergeMsgT > 0 ? mergeMsg : null;
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
  const px = 40, py = 40, pw = W - 80, ph = H - 80;
  mergePanel.x = px; mergePanel.y = py; mergePanel.w = pw; mergePanel.h = ph;
  ctx.fillStyle = 'rgba(12,14,20,.98)'; ctx.fillRect(px, py, pw, ph);
  ctx.strokeStyle = '#7a5b2a'; ctx.lineWidth = 2; ctx.strokeRect(px, py, pw, ph);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffcf5c'; ctx.font = 'bold 19px sans-serif';
  ctx.fillText(mergeTab === 'forge' ? '⚒  Forge — combine 3 into 1' : '✦  Shards — craft what you want', px + 20, py + 30);
  ctx.fillStyle = '#7f8794'; ctx.font = '12px sans-serif';
  ctx.fillText(mergeTab === 'forge'
    ? 'Pick 3 of the SAME type AND rarity (e.g. 3 Uncommon Bows) → 1 Rare Bow, random stats.'
    : `Salvage loot into shards (Inventory → ✖ Salvage). ${SHARD_COST} shards = any item of that rarity.`, px + 20, py + 50);

  // Tabs
  [['forge', '⚒ Forge'], ['shards', '✦ Shards']].forEach(([id, label], i) => {
    const tw = 104, tx = px + 20 + i * (tw + 8), ty = py + 60;
    mergeRects.push({ x: tx, y: ty, w: tw, h: 28, kind: 'tab', ref: id });
    const on = mergeTab === id;
    ctx.fillStyle = on ? '#3a2c12' : '#171a21'; ctx.fillRect(tx, ty, tw, 28);
    ctx.strokeStyle = on ? '#ffcf5c' : '#3a4150'; ctx.lineWidth = on ? 2 : 1; ctx.strokeRect(tx, ty, tw, 28);
    ctx.fillStyle = on ? '#ffcf5c' : '#9aa0a8'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(label, tx + tw / 2, ty + 19); ctx.textAlign = 'left';
  });
  if (mergeTab === 'shards') { drawShardsTab(px, py, pw, ph); return; }

  const cb = { x: px + pw - 52, y: py + 14, w: 40, h: 40, kind: 'close' };
  mergeRects.push(cb);
  ctx.fillStyle = '#241a1f'; ctx.fillRect(cb.x, cb.y, cb.w, cb.h);
  ctx.strokeStyle = '#7a4b5c'; ctx.lineWidth = 2; ctx.strokeRect(cb.x, cb.y, cb.w, cb.h);
  ctx.fillStyle = '#ff9a9a'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('✕', cb.x + cb.w / 2, cb.y + cb.h / 2 + 8); ctx.textAlign = 'left';

  const narrow = W < 700; // portrait: stack sections
  const colW = narrow ? pw - 40 : pw / 2 - 30;
  const leftX = px + 20, rightX = narrow ? px + 20 : px + pw / 2 + 10, top = py + 110;

  // ---- the three forge slots + result preview + FORGE button ----
  const locked = mergeLockedRarity(), lockedType = mergeLockedType();
  ctx.fillStyle = '#e8eef6'; ctx.font = 'bold 15px sans-serif';
  ctx.fillText(locked ? `Slots — ${locked.name} ${lockedType}` : 'Slots — tap items on the right', leftX, top);
  const sw = (colW - 16) / 3, sh = 74;
  for (let i = 0; i < 3; i++) {
    const sx = leftX + i * (sw + 8), sy = top + 14;
    mergeRects.push({ x: sx, y: sy, w: sw, h: sh, kind: 'slot', ref: i });
    const it = mergeSlots[i];
    ctx.fillStyle = '#171a21'; ctx.fillRect(sx, sy, sw, sh);
    ctx.strokeStyle = it ? it.rarity.color : '#3a4150'; ctx.lineWidth = 2;
    if (!it) { ctx.setLineDash([5, 4]); } ctx.strokeRect(sx, sy, sw, sh); ctx.setLineDash([]);
    ctx.textAlign = 'center';
    if (it) {
      drawGem(sx + sw / 2, sy + 22, it.rarity.color, 8);
      ctx.fillStyle = it.rarity.color; ctx.font = 'bold 10px sans-serif';
      ctx.fillText(it.name.split(' ').slice(1).join(' '), sx + sw / 2, sy + 46);
      ctx.fillStyle = '#6b7280'; ctx.font = '9px sans-serif'; ctx.fillText('tap to remove', sx + sw / 2, sy + 62);
    } else { ctx.fillStyle = '#41474f'; ctx.font = '11px sans-serif'; ctx.fillText('empty', sx + sw / 2, sy + sh / 2 + 4); }
    ctx.textAlign = 'left';
  }
  // Result preview
  const ry = top + 14 + sh + 22;
  ctx.fillStyle = '#9aa0a8'; ctx.font = '13px sans-serif';
  if (locked) {
    const i0 = RARITIES.indexOf(locked);
    if (i0 < RARITIES.length - 1) {
      ctx.fillText('Result:', leftX, ry);
      ctx.fillStyle = locked.color; ctx.font = 'bold 13px sans-serif'; ctx.fillText(`3× ${locked.name} ${lockedType}`, leftX + 52, ry);
      const wdt = ctx.measureText(`3× ${locked.name} ${lockedType}`).width;
      ctx.fillStyle = '#9aa0a8'; ctx.font = '14px sans-serif'; ctx.fillText('→', leftX + 58 + wdt, ry);
      ctx.fillStyle = RARITIES[i0 + 1].color; ctx.font = 'bold 14px sans-serif'; ctx.fillText(`1× ${RARITIES[i0 + 1].name} ${lockedType}`, leftX + 78 + wdt, ry);
    }
  } else { ctx.fillText('Result: pick 3 matching items', leftX, ry); }

  // FORGE button
  const fb = { x: leftX, y: ry + 18, w: colW, h: 52, kind: 'forge' };
  const ready = canForge();
  mergeRects.push(fb);
  ctx.fillStyle = ready ? '#3a2c12' : '#171a21'; ctx.fillRect(fb.x, fb.y, fb.w, fb.h);
  ctx.strokeStyle = ready ? '#ffcf5c' : '#2a2f38'; ctx.lineWidth = 2; ctx.strokeRect(fb.x, fb.y, fb.w, fb.h);
  ctx.fillStyle = ready ? '#ffcf5c' : '#4a4f58'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(ready ? '⚒  FORGE' : `FORGE  (${mergeCount()}/3)`, fb.x + fb.w / 2, fb.y + 33); ctx.textAlign = 'left';
  if (mergeMsg) { ctx.fillStyle = '#ffe08a'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(mergeMsg, leftX + colW / 2, fb.y + 70); ctx.textAlign = 'left'; }

  // ---- scrollable backpack, grouped so matching sets sit together ----
  const list = player.inventory.slice().sort((a, b) => {
    const ra = RARITIES.indexOf(b.rarity) - RARITIES.indexOf(a.rarity);
    if (ra !== 0) return ra;
    return itemTypeOf(a).localeCompare(itemTypeOf(b));
  });
  const bagTop = narrow ? fb.y + fb.h + 40 : top;
  const total = list.length;
  let by = bagTop + 14;
  const rowH = 34;
  const maxRows = Math.max(1, Math.floor((py + ph - by - 20) / rowH));
  mergeMaxRows = maxRows;
  const maxScroll = Math.max(0, total - maxRows);
  mergeScroll = clamp(mergeScroll, 0, maxScroll);
  ctx.fillStyle = '#e8eef6'; ctx.font = 'bold 15px sans-serif'; ctx.fillText(`Backpack (${total})`, rightX, bagTop);
  if (total > maxRows) {
    const up = { x: rightX + colW - 76, y: bagTop - 18, w: 34, h: 24, kind: 'scrollUp' };
    const dn = { x: rightX + colW - 38, y: bagTop - 18, w: 34, h: 24, kind: 'scrollDown' };
    for (const b of [up, dn]) {
      mergeRects.push(b);
      ctx.fillStyle = '#171a21'; ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = '#3a4150'; ctx.lineWidth = 1; ctx.strokeRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = '#cfd4dc'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(b.kind === 'scrollUp' ? '▲' : '▼', b.x + b.w / 2, b.y + 17); ctx.textAlign = 'left';
    }
  }
  if (total === 0) { ctx.fillStyle = '#7f8794'; ctx.font = '13px sans-serif'; ctx.fillText('Empty — go kill things.', rightX + 4, by + 16); }
  const visible = list.slice(mergeScroll, mergeScroll + maxRows);
  for (const it of visible) {
    const selectable = (!locked || (it.rarity === locked && itemTypeOf(it) === lockedType)) && RARITIES.indexOf(it.rarity) < RARITIES.length - 1;
    mergeRects.push({ x: rightX, y: by, w: colW, h: rowH - 5, kind: 'pick', ref: it });
    ctx.globalAlpha = selectable ? 1 : 0.32;
    ctx.fillStyle = '#171a21'; ctx.fillRect(rightX, by, colW, rowH - 5);
    ctx.strokeStyle = '#23272f'; ctx.lineWidth = 1; ctx.strokeRect(rightX, by, colW, rowH - 5);
    ctx.fillStyle = it.rarity.color; ctx.font = 'bold 12px sans-serif'; ctx.fillText(it.name, rightX + 10, by + 13);
    ctx.fillStyle = '#9aa0a8'; ctx.font = '10px sans-serif'; ctx.fillText(itemStatText(it), rightX + 10, by + 25);
    ctx.globalAlpha = 1;
    by += rowH;
  }
  if (total > maxRows) { ctx.fillStyle = '#6b7280'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right'; ctx.fillText(`${mergeScroll + 1}–${mergeScroll + visible.length} of ${total}`, rightX + colW, py + ph - 8); ctx.textAlign = 'left'; }
}

// The Shards tab: shard counts, convert-up, and crafting the exact item you want.
function drawShardsTab(px, py, pw, ph) {
  const leftX = px + 20, colW = pw - 40, top = py + 110;
  ctx.textAlign = 'left';

  // --- shard counters (tap one to select which rarity you're crafting) ---
  ctx.fillStyle = '#e8eef6'; ctx.font = 'bold 14px sans-serif'; ctx.fillText('Your shards — tap to select', leftX, top);
  const cw = Math.min(120, (colW - 4 * 8) / 5), ch = 52;
  RARITIES.forEach((r, i) => {
    const x = leftX + i * (cw + 8), y = top + 10;
    mergeRects.push({ x, y, w: cw, h: ch, kind: 'pickRarity', ref: i });
    const sel = craftRarityIdx === i;
    ctx.fillStyle = sel ? '#20242e' : '#171a21'; ctx.fillRect(x, y, cw, ch);
    ctx.strokeStyle = sel ? r.color : '#2a2f38'; ctx.lineWidth = sel ? 3 : 1; ctx.strokeRect(x, y, cw, ch);
    ctx.textAlign = 'center';
    ctx.fillStyle = r.color; ctx.font = 'bold 10px sans-serif'; ctx.fillText(r.name, x + cw / 2, y + 16);
    ctx.fillStyle = player.shards[i] >= SHARD_COST ? '#5fe08b' : '#cfd4dc'; ctx.font = 'bold 17px sans-serif';
    ctx.fillText(String(player.shards[i]), x + cw / 2, y + 38);
    ctx.fillStyle = '#5a5f68'; ctx.font = '8px sans-serif'; ctx.fillText('/' + SHARD_COST, x + cw / 2, y + 48);
    ctx.textAlign = 'left';
  });

  const R = RARITIES[craftRarityIdx];
  let y = top + 10 + ch + 26;

  // --- convert 3 lower shards into 1 of the next tier ---
  if (craftRarityIdx < RARITIES.length - 1) {
    const bw = Math.min(300, colW), bx = leftX;
    const okc = player.shards[craftRarityIdx] >= SHARD_CONVERT;
    mergeRects.push({ x: bx, y, w: bw, h: 30, kind: 'convert', ref: craftRarityIdx });
    ctx.fillStyle = okc ? '#1c2a20' : '#171a21'; ctx.fillRect(bx, y, bw, 30);
    ctx.strokeStyle = okc ? '#5fcf8f' : '#2a2f38'; ctx.lineWidth = 1; ctx.strokeRect(bx, y, bw, 30);
    ctx.fillStyle = okc ? '#8be0a8' : '#4a4f58'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(`⇧  ${SHARD_CONVERT} ${R.name} → 1 ${RARITIES[craftRarityIdx + 1].name} shard`, bx + bw / 2, y + 20); ctx.textAlign = 'left';
    y += 42;
  }

  // --- craft picker ---
  const ready = canCraft(craftRarityIdx);
  ctx.fillStyle = '#e8eef6'; ctx.font = 'bold 14px sans-serif';
  ctx.fillText(`Craft any ${R.name} item`, leftX, y);
  ctx.fillStyle = ready ? '#5fe08b' : '#ff9a9a'; ctx.font = 'bold 12px sans-serif';
  ctx.fillText(ready ? `Ready — costs ${SHARD_COST} shards` : `You have ${player.shards[craftRarityIdx]}/${SHARD_COST} shards`, leftX + 190, y);
  y += 12;

  const cols = W < 700 ? 3 : 5, bwT = (colW - (cols - 1) * 8) / cols, bhT = 34;
  ITEM_TYPES.forEach((t, i) => {
    const cx = leftX + (i % cols) * (bwT + 8), cy = y + Math.floor(i / cols) * (bhT + 8);
    if (cy + bhT > py + ph - 54) return;
    mergeRects.push({ x: cx, y: cy, w: bwT, h: bhT, kind: 'craft', ref: t.type });
    const hov = mouse.x >= cx && mouse.x <= cx + bwT && mouse.y >= cy && mouse.y <= cy + bhT;
    ctx.fillStyle = ready ? (hov ? '#2a2f3a' : '#171a21') : '#131519'; ctx.fillRect(cx, cy, bwT, bhT);
    ctx.strokeStyle = ready ? R.color : '#242830'; ctx.lineWidth = 1; ctx.strokeRect(cx, cy, bwT, bhT);
    ctx.fillStyle = ready ? '#cfd4dc' : '#4a4f58'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(t.type, cx + bwT / 2, cy + 21); ctx.textAlign = 'left';
  });

  if (mergeMsg) { ctx.fillStyle = '#ffe08a'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(mergeMsg, px + pw / 2, py + ph - 16); ctx.textAlign = 'left'; }
  else { ctx.fillStyle = '#6b7280'; ctx.font = '11px sans-serif'; ctx.fillText('Salvage items in the Inventory (✖ Salvage) to earn shards.', leftX, py + ph - 16); }
}

function handleMergeClick() {
  for (const r of mergeRects) {
    if (mouse.x >= r.x && mouse.x <= r.x + r.w && mouse.y >= r.y && mouse.y <= r.y + r.h) {
      if (r.kind === 'close') closeMerge();
      else if (r.kind === 'tab') { returnMergeItems(); mergeTab = r.ref; mergeMsg = null; }
      else if (r.kind === 'pickRarity') { craftRarityIdx = r.ref; mergeMsg = null; }
      else if (r.kind === 'convert') convertShards(r.ref);
      else if (r.kind === 'craft') craftFromShards(craftRarityIdx, r.ref);
      else if (r.kind === 'slot') removeFromMerge(r.ref);
      else if (r.kind === 'pick') addToMerge(r.ref);
      else if (r.kind === 'forge') doForge();
      else if (r.kind === 'scrollUp') mergeScroll -= Math.max(1, mergeMaxRows - 1);
      else if (r.kind === 'scrollDown') mergeScroll += Math.max(1, mergeMaxRows - 1);
      return true;
    }
  }
  return mouse.x >= mergePanel.x && mouse.x <= mergePanel.x + mergePanel.w && mouse.y >= mergePanel.y && mouse.y <= mergePanel.y + mergePanel.h;
}

function statLabel(stat, val) {
  if (stat === 'Crit') return `+${val}% Crit`;
  if (stat === 'CritDmg') return `+${val}% Crit Dmg`;
  if (stat === 'SpellHaste') return `+${val}% Spell Haste`;
  if (stat === 'AtkSpeed') return `+${val}% Atk Speed`;
  if (stat === 'SpellPower') return `+${val} Spell Power`;
  if (stat === 'AtkDmg') return `+${val} Attack Dmg`;
  return `+${val} ${stat}`;
}
function itemStatText(it) {
  let s = statLabel(it.stat, it.value);
  if (it.bonusStat) s += `  ${statLabel(it.bonusStat, it.bonusValue)}`;
  if (it.bonusStat2) s += `  ${statLabel(it.bonusStat2, it.bonusValue2)}`;
  if (it.bonusStat3) s += `  ${statLabel(it.bonusStat3, it.bonusValue3)}`;
  if (isTwoHanded(it)) s += '  · 2H';
  return s;
}
function handleInventoryClick() {
  for (const r of invRects) {
    if (mouse.x >= r.x && mouse.x <= r.x + r.w && mouse.y >= r.y && mouse.y <= r.y + r.h) {
      if (r.kind === 'close') showInv = false;
      else if (r.kind === 'forgeOpen') openMerge();
      else if (r.kind === 'salvageToggle') salvageMode = !salvageMode;
      else if (r.kind === 'salvageAll') salvageAllOfRarity(r.ref);
      else if (r.kind === 'bag') {
        if (salvageMode) { const rr = r.ref.rarity; if (salvageItem(r.ref)) fx.push({ kind: 'toast', text: `+1 ${rr.name} Shard`, life: 80, maxLife: 80 }); }
        else equipItem(r.ref);
      }
      else if (r.kind === 'slot') unequipSlot(r.ref);
      else if (r.kind === 'scrollUp') invScroll -= Math.max(1, invMaxRows - 1);
      else if (r.kind === 'scrollDown') invScroll += Math.max(1, invMaxRows - 1);
      return true;
    }
  }
  return mouse.x >= invPanel.x && mouse.x <= invPanel.x + invPanel.w && mouse.y >= invPanel.y && mouse.y <= invPanel.y + invPanel.h;
}

// --------------------------------------------------------------------
//  CLASS-SELECT MENU
// --------------------------------------------------------------------
let menuRects = [];
function wrapText(text, cx, y, maxW, lh) {
  const words = text.split(' '); let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, cx, y); line = w; y += lh; }
    else line = test;
  }
  if (line) ctx.fillText(line, cx, y);
}
function drawMenu() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#14161c'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e8eef6'; ctx.font = 'bold 32px sans-serif'; ctx.fillText('THE GAME', W / 2, 84);
  ctx.fillStyle = '#9aa0a8'; ctx.font = '15px sans-serif'; ctx.fillText('Choose your class', W / 2, 112);
  ctx.fillStyle = '#5fcf8f'; ctx.font = 'bold 12px sans-serif';
  ctx.fillText(`v1.3 · ${W}×${H} · ${W < H ? 'PORTRAIT' : 'landscape'}`, W / 2, 132);

  menuRects = [];
  const gap = 20;
  const wide = W >= CLASSES.length * 230 + (CLASSES.length - 1) * gap + 40;
  if (wide) {
    // Landscape / desktop: three cards side by side
    const cw = 230, ch = 290, total = CLASSES.length * cw + (CLASSES.length - 1) * gap;
    const x0 = (W - total) / 2, y0 = 150;
    CLASSES.forEach((c, i) => {
      const x = x0 + i * (cw + gap);
      menuRects.push({ x, y: y0, w: cw, h: ch, cls: c });
      const hover = mouse.x >= x && mouse.x <= x + cw && mouse.y >= y0 && mouse.y <= y0 + ch;
      ctx.fillStyle = hover ? '#20242e' : '#191c24'; ctx.fillRect(x, y0, cw, ch);
      ctx.strokeStyle = c.color; ctx.lineWidth = hover ? 3 : 2; ctx.strokeRect(x, y0, cw, ch);
      ctx.fillStyle = c.color; ctx.beginPath(); ctx.arc(x + cw / 2, y0 + 66, 32, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e8eef6'; ctx.font = 'bold 22px sans-serif'; ctx.fillText(c.name, x + cw / 2, y0 + 130);
      ctx.fillStyle = c.color; ctx.font = 'bold 13px sans-serif'; ctx.fillText(`Primary: ${c.primary}`, x + cw / 2, y0 + 154);
      ctx.fillStyle = '#9aa0a8'; ctx.font = '12px sans-serif'; wrapText(c.desc, x + cw / 2, y0 + 182, cw - 34, 16);
      ctx.fillStyle = '#6b7280'; ctx.font = '11px sans-serif'; ctx.fillText(`Starts with: ${c.startWeapon}`, x + cw / 2, y0 + ch - 20);
    });
    ctx.fillStyle = '#7f8794'; ctx.font = '13px sans-serif'; ctx.fillText('Click a class to begin', W / 2, y0 + ch + 40);
  } else {
    // Portrait: stacked rows
    const cw = W - 60, ch = 132, x = 30;
    const y0 = Math.max(150, (H - (CLASSES.length * (ch + gap) - gap)) / 2);
    CLASSES.forEach((c, i) => {
      const y = y0 + i * (ch + gap);
      menuRects.push({ x, y, w: cw, h: ch, cls: c });
      const hover = mouse.x >= x && mouse.x <= x + cw && mouse.y >= y && mouse.y <= y + ch;
      ctx.fillStyle = hover ? '#20242e' : '#191c24'; ctx.fillRect(x, y, cw, ch);
      ctx.strokeStyle = c.color; ctx.lineWidth = hover ? 3 : 2; ctx.strokeRect(x, y, cw, ch);
      ctx.fillStyle = c.color; ctx.beginPath(); ctx.arc(x + 54, y + ch / 2, 30, 0, Math.PI * 2); ctx.fill();
      ctx.textAlign = 'left';
      ctx.fillStyle = '#e8eef6'; ctx.font = 'bold 21px sans-serif'; ctx.fillText(c.name, x + 100, y + 34);
      ctx.fillStyle = c.color; ctx.font = 'bold 12px sans-serif'; ctx.fillText(`Primary: ${c.primary}  ·  ${c.startWeapon}`, x + 100, y + 54);
      ctx.fillStyle = '#9aa0a8'; ctx.font = '12px sans-serif'; wrapText(c.desc, x + 100, y + 76, cw - 120, 15);
      ctx.textAlign = 'center';
    });
    ctx.fillStyle = '#7f8794'; ctx.font = '13px sans-serif'; ctx.fillText('Tap a class to begin', W / 2, y0 + CLASSES.length * (ch + gap) + 16);
  }
  ctx.textAlign = 'start';
}
function handleMenuClick() {
  for (const r of menuRects) {
    if (mouse.x >= r.x && mouse.x <= r.x + r.w && mouse.y >= r.y && mouse.y <= r.y + r.h) { startRun(r.cls); return; }
  }
}

// --------------------------------------------------------------------
//  START
// --------------------------------------------------------------------
recomputeStats();
resizeCanvas();
function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
